name: apply-pickword-image-action-grid-20260820

on:
  pull_request:
    branches: [beta]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/pickword-image-action-grid-trigger-20260820'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}

      - name: Apply bounded patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '...<TRUNCATED_BASE64>...' | base64 -d > scripts/_tmp_pickword_image_action_grid_20260820.py
          python3 scripts/_tmp_pickword_image_action_grid_20260820.py
          rm -f scripts/_tmp_pickword_image_action_grid_20260820.py

      - name: Verify signing normalizers are idempotent
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_pickword_qr_integration.py
          python3 scripts/apply_pickword_reference_layout.py
          python3 scripts/fix_pickword_reference_layout_api_usage.py
          python3 scripts/apply_shortx_ui_qr_compat.py

      - name: Targeted verification
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/es5_scan.py
          python3 scripts/verify_js_syntax.py
          python3 scripts/verify_code_constraints.py
          python3 scripts/verify_module_boundaries.py
          python3 scripts/verify_pickword_qr.py
          python3 scripts/verify_pickword_image_viewer.py
          python3 scripts/verify_pickword_long_click_api34.py
          python3 scripts/verify_pickword_share_close_cleanup.py
          python3 scripts/verify_pickword_unified_cleanup.py
          python3 scripts/verify_pickword_emoji_grapheme.py
          python3 scripts/verify_channel_private_storage_isolation.py
          python3 scripts/verify_pickword_image_meta_handoff.py
          python3 scripts/verify_result_preview.py
          python3 scripts/verify_update_history.py --require-one-pending
          git diff --check

      - name: Verify scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- code/th_22_image_viewer.js
          python3 - <<'PY2'
          import subprocess
          allowed = ['code/th_20_pickword.js', 'code/th_26_qr_runtime.js', 'scripts/verify_pickword_long_click_api34.py', 'scripts/verify_pickword_unified_cleanup.py', 'scripts/verify_pickword_emoji_grapheme.py', 'scripts/verify_channel_private_storage_isolation.py', 'scripts/verify_pickword_image_meta_handoff.py', 'scripts/verify_pickword_qr.py', 'scripts/verify_manifest.py', 'scripts/verify_pickword_image_viewer.py', 'scripts/apply_pickword_reference_layout.py', 'scripts/fix_pickword_reference_layout_api_usage.py', 'scripts/apply_pickword_qr_integration.py', 'scripts/apply_shortx_ui_qr_compat.py', 'updates/records/20260820-beta-pickword-image-action-grid-icons.json']
          changed = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          extra = [x for x in changed if x not in allowed]
          missing_core = [x for x in ('code/th_20_pickword.js','code/th_26_qr_runtime.js') if x not in changed]
          if extra:
              raise SystemExit('unexpected changed files: ' + ', '.join(extra))
          if missing_core:
              raise SystemExit('core patch missing: ' + ', '.join(missing_core))
          print('scope OK files=' + str(len(changed)))
          PY2
          grep -q '^// @version 1.0.24$' code/th_20_pickword.js
          grep -q '^// @version 1.0.8$' code/th_26_qr_runtime.js
          grep -q 'function resolvePickwordShortXActionDrawable20(kind)' code/th_20_pickword.js
          grep -q 'controller.performPickwordQrAction = function(action)' code/th_26_qr_runtime.js
          ! grep -q 'textButton26(' code/th_26_qr_runtime.js

      - name: Commit and push beta
        env:
          TOKEN: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'code/th_20_pickword.js' 'code/th_26_qr_runtime.js' 'scripts/verify_pickword_long_click_api34.py' 'scripts/verify_pickword_unified_cleanup.py' 'scripts/verify_pickword_emoji_grapheme.py' 'scripts/verify_channel_private_storage_isolation.py' 'scripts/verify_pickword_image_meta_handoff.py' 'scripts/verify_pickword_qr.py' 'scripts/verify_manifest.py' 'scripts/verify_pickword_image_viewer.py' 'scripts/apply_pickword_reference_layout.py' 'scripts/fix_pickword_reference_layout_api_usage.py' 'scripts/apply_pickword_qr_integration.py' 'scripts/apply_shortx_ui_qr_compat.py' 'updates/records/20260820-beta-pickword-image-action-grid-icons.json'
          git diff --cached --check
          git commit -m '优化拾字截图 2x3 ShortX 图标操作区'
          git push "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:beta
