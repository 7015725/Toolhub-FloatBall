name: apply-pickword-image-action-grid-20260820

on:
  pull_request:
    branches: [beta]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/pickword-image-action-grid-trigger-20260820'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}

      - name: Load bounded patch from PR head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.event.pull_request.head.ref }}"
          git show FETCH_HEAD:scripts/_trigger_pickword_image_action_grid_20260820.py > scripts/_tmp_pickword_image_action_grid_20260820.py
          python3 scripts/_tmp_pickword_image_action_grid_20260820.py
          rm -f scripts/_tmp_pickword_image_action_grid_20260820.py
          python3 - <<'PYFIX'
          from pathlib import Path
          path = Path('scripts/apply_pickword_qr_integration.py')
          text = path.read_text(encoding='utf-8')
          bad = 'if current_qr_text.startswith("// @version 1.0.8\n"):'
          good = 'if current_qr_text.startswith("// @version 1.0.8\\n"):'
          if bad not in text:
              raise SystemExit('expected generated QR verifier newline defect not found')
          text = text.replace(bad, good, 1)
          path.write_text(text, encoding='utf-8')
          PYFIX
          python3 -m py_compile scripts/apply_pickword_qr_integration.py

      - name: Verify signing normalizers are idempotent
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_pickword_qr_integration.py
          python3 scripts/apply_pickword_reference_layout.py
          python3 scripts/fix_pickword_reference_layout_api_usage.py
          python3 scripts/apply_shortx_ui_qr_compat.py

      - name: Refresh reviewed API baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/register_pickword_qr_api_usage.py
          python3 scripts/report_api_usage.py --write constraints/API_USAGE_BASELINE.json
          python3 - <<'PYAPI'
          import json
          from pathlib import Path

          api_path = Path('constraints/api.json')
          baseline_path = Path('constraints/API_USAGE_BASELINE.json')
          api = json.loads(api_path.read_text(encoding='utf-8'))
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          keys = [
              'android|class|android.widget.ImageView',
              'android|method|android.widget#ImageView',
              'android|method|android.widget.LinearLayout#getTag',
              'android|method|android.widget.LinearLayout#setAlpha',
              'android|method|android.widget.LinearLayout#setEnabled',
              'android|method|android.widget.TextView#setImageDrawable',
              'android|method|android.widget.TextView#setScaleType',
          ]
          by_key = {str(x.get('key', '')): x for x in (baseline.get('entries') or [])}
          missing = [key for key in keys if key not in by_key]
          if missing:
              raise SystemExit('pickword action-grid API keys missing from scan: ' + ', '.join(missing))
          scope = sorted({path for key in keys for path in (by_key[key].get('files') or [])})
          if 'code/th_20_pickword.js' not in scope:
              raise SystemExit('th_20 missing from reviewed action-grid API scope')
          rule = {
              'id': 'api-pickword-image-action-grid-icons',
              'usageKeys': keys,
              'source': 'android',
              'classOrObject': 'ImageView and existing LinearLayout tile state APIs',
              'method': 'ShortX drawable icon rendering and QR action-state updates',
              'classification': 'guarded',
              'scope': scope,
              'allowScopeExpansion': True,
              'minApi': 23,
              'guard': 'Only the pickword screenshot 2x3 action grid creates the new ImageView icon and updates tile state; drawable lookup reuses the existing ShortX resource resolver.',
              'owner': 'ToolHub Beta pickword screenshot action grid',
              'threadContract': 'Tile construction, icon replacement, alpha/enabled state and QR state listener callbacks execute on the existing Android main/UI owner path.',
              'fallback': 'Missing ShortX drawable falls back to an Android help drawable; QR runtime errors only disable QR-dependent cells and do not block screenshot viewing, sharing or saving.',
              'reason': 'Explicitly review the finite API keys and exact current file scopes needed by the icon-only 2x3 screenshot action grid; no usage-key prefix or wildcard scope is introduced.',
          }
          rules = api.get('rules') or []
          rules = [x for x in rules if str(x.get('id', '')) != rule['id']]
          rules.append(rule)
          api['rules'] = rules
          api_path.write_text(json.dumps(api, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('OK action-grid API policy keys=%d scope_files=%d' % (len(keys), len(scope)))
          PYAPI
          python3 scripts/report_api_usage.py --check constraints/API_USAGE_BASELINE.json

      - name: Targeted verification
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/es5_scan.py
          python3 scripts/verify_js_syntax.py
          python3 scripts/verify_code_constraints.py
          python3 scripts/verify_module_boundaries.py
          python3 scripts/verify_pickword_qr.py
          python3 scripts/verify_pickword_image_viewer.py
          python3 scripts/verify_pickword_long_click_api34.py
          python3 scripts/verify_pickword_share_close_cleanup.py
          python3 scripts/verify_pickword_unified_cleanup.py
          python3 scripts/verify_pickword_emoji_grapheme.py
          python3 scripts/verify_channel_private_storage_isolation.py
          python3 scripts/verify_pickword_image_meta_handoff.py
          python3 scripts/verify_result_preview.py
          python3 scripts/verify_update_history.py --require-one-pending
          git diff --check

      - name: Verify scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- code/th_22_image_viewer.js
          python3 - <<'PY2'
          import subprocess
          allowed = [
              'code/th_20_pickword.js',
              'code/th_26_qr_runtime.js',
              'constraints/API_USAGE_BASELINE.json',
              'constraints/api.json',
              'scripts/verify_pickword_long_click_api34.py',
              'scripts/verify_pickword_unified_cleanup.py',
              'scripts/verify_pickword_emoji_grapheme.py',
              'scripts/verify_channel_private_storage_isolation.py',
              'scripts/verify_pickword_image_meta_handoff.py',
              'scripts/verify_pickword_qr.py',
              'scripts/verify_manifest.py',
              'scripts/verify_pickword_image_viewer.py',
              'scripts/apply_pickword_reference_layout.py',
              'scripts/fix_pickword_reference_layout_api_usage.py',
              'scripts/apply_pickword_qr_integration.py',
              'scripts/apply_shortx_ui_qr_compat.py',
              'updates/records/20260820-beta-pickword-image-action-grid-icons.json',
          ]
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          extra = [x for x in changed if x not in allowed]
          missing = [x for x in ('code/th_20_pickword.js', 'code/th_26_qr_runtime.js', 'constraints/API_USAGE_BASELINE.json', 'constraints/api.json') if x not in changed]
          if extra:
              raise SystemExit('unexpected changed files: ' + ', '.join(extra))
          if missing:
              raise SystemExit('core patch missing: ' + ', '.join(missing))
          print('scope OK files=' + str(len(changed)))
          PY2
          grep -q '^// @version 1.0.24$' code/th_20_pickword.js
          grep -q '^// @version 1.0.8$' code/th_26_qr_runtime.js
          grep -q 'function resolvePickwordShortXActionDrawable20(kind)' code/th_20_pickword.js
          grep -q 'controller.performPickwordQrAction = function(action)' code/th_26_qr_runtime.js
          ! grep -q 'textButton26(' code/th_26_qr_runtime.js

      - name: Commit and push beta
        shell: bash
        env:
          TOKEN: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            'code/th_20_pickword.js' \
            'code/th_26_qr_runtime.js' \
            'constraints/API_USAGE_BASELINE.json' \
            'constraints/api.json' \
            'scripts/verify_pickword_long_click_api34.py' \
            'scripts/verify_pickword_unified_cleanup.py' \
            'scripts/verify_pickword_emoji_grapheme.py' \
            'scripts/verify_channel_private_storage_isolation.py' \
            'scripts/verify_pickword_image_meta_handoff.py' \
            'scripts/verify_pickword_qr.py' \
            'scripts/verify_manifest.py' \
            'scripts/verify_pickword_image_viewer.py' \
            'scripts/apply_pickword_reference_layout.py' \
            'scripts/fix_pickword_reference_layout_api_usage.py' \
            'scripts/apply_pickword_qr_integration.py' \
            'scripts/apply_shortx_ui_qr_compat.py' \
            'updates/records/20260820-beta-pickword-image-action-grid-icons.json'
          git diff --cached --check
          git commit -m '优化拾字截图 2x3 ShortX 图标操作区'
          git push "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:beta
