name: finalize2-repair-entry-source-ref

on:
  pull_request:
    branches: [beta]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: finalize2-repair-entry-source-ref
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'agent/beta-fix-wm-remove-view-crash-20260726'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta-fix-wm-remove-view-crash-20260726
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply reviewed entry patch
        shell: bash
        run: |
          python3 - <<'PYEXTRACT'
          from pathlib import Path
          source = Path('.github/workflows/apply-repair-entry-source-ref.yml').read_text(encoding='utf-8')
          begin_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n"
          begin = source.index(begin_marker)
          end = source.index(end_marker, begin) + len(end_marker)
          lines = []
          for line in source[begin:end].splitlines():
              if line == '':
                  lines.append('')
              elif line.startswith('          '):
                  lines.append(line[10:])
              else:
                  raise SystemExit('unexpected indentation: ' + line)
          Path('/tmp/apply-entry-source.sh').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PYEXTRACT
          bash /tmp/apply-entry-source.sh

      - name: Preserve GitHub-only naming constraints
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = (
              ('TOOLHUB_ENTRY_UPDATE_SOURCE_REF', 'TOOLHUB_ENTRY_FETCH_REF'),
              ('TOOLHUB_UPDATE_SOURCE_REF', 'TOOLHUB_FETCH_REF'),
          )
          for rel in ('ToolHub.js', 'scripts/verify_github_only_source.py'):
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit('%s missing symbol %s' % (rel, old))
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          if 'UPDATE_SOURCE' in Path('ToolHub.js').read_text(encoding='utf-8'):
              raise SystemExit('legacy UPDATE_SOURCE fragment remains in ToolHub.js')
          PY

      - name: Install signing key
        shell: bash
        env:
          TOOLHUB_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.TOOLHUB_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          test -n "$TOOLHUB_SIGNING_PRIVATE_KEY_PEM"
          mkdir -p "$HOME/.hermes/toolhub_signing"
          printf '%s\n' "$TOOLHUB_SIGNING_PRIVATE_KEY_PEM" > "$HOME/.hermes/toolhub_signing/private_key.pem"
          chmod 600 "$HOME/.hermes/toolhub_signing/private_key.pem"

      - name: Generate Beta-relative signed artifacts
        shell: bash
        run: |
          git fetch --no-tags origin beta
          python3 scripts/generate_signed_manifest.py --yes --channel beta --base-ref origin/beta

      - name: Run targeted verification
        shell: bash
        run: |
          set -eo pipefail
          python3 .github/scripts/es5_scan.py
          python3 scripts/verify_js_syntax.py
          python3 scripts/verify_code_constraints.py --output code-constraint-report.json
          python3 scripts/verify_github_only_source.py
          python3 scripts/verify_update_security_mode.py
          python3 scripts/verify_changed_module_versions.py --base-ref origin/beta
          python3 scripts/verify_main_panel_close_lifecycle.py
          python3 scripts/verify_update_history.py
          python3 scripts/verify_manifest.py
          python3 scripts/verify_update_version_page.py
          python3 .github/scripts/verify_manifest_signature.py
          git diff --check

      - name: Commit entry ref and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-repair-entry-source-ref.yml
          git rm .github/workflows/diagnose-repair-entry-source-ref.yml
          git rm .github/workflows/finalize-repair-entry-source-ref.yml
          git rm .github/workflows/diagnose-final-repair-entry-source-ref.yml
          git rm .github/workflows/finalize2-repair-entry-source-ref.yml
          git add ToolHub.js ToolHub.js.sha256 manifest.json manifest.sig update_history.json \
            updates/records/20260726-beta-system-server-window-remove-crash.json scripts
          git commit -m "指定修复分支入口更新源"
          git push origin HEAD:agent/beta-fix-wm-remove-view-crash-20260726
