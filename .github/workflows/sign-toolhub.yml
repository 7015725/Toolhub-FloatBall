name: sign-toolhub

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sign-toolhub-beta-mask-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: signing
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN || github.token }}
          persist-credentials: false

      - name: Preserve trusted signing workflow
        shell: bash
        run: git show HEAD^:.github/workflows/sign-toolhub.yml > /tmp/sign-toolhub-original.yml

      - name: Apply reviewed ToolApp mask fix
        shell: bash
        run: |
          git fetch --no-tags origin main
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_beta_mask_toolapp_zorder_fix.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for workflow_path in (
                  ROOT / ".github/workflows/verify.yml",
                  ROOT / ".github/workflows/sign-toolhub.yml",
              ):
          '''
          new = '''    for workflow_path in (
                  ROOT / ".github/workflows/verify.yml",
              ):
          '''
          if text.count(old) != 1:
              raise SystemExit('helper workflow tuple mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/apply_beta_mask_toolapp_zorder_fix.py

      - name: Restore signing workflow with permanent verifier
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/sign-toolhub-original.yml').read_text(encoding='utf-8')
          marker = '''      - name: Verify ShortXUI WindowHost
                run: python3 scripts/verify_shortx_ui_windowhost.py
          '''
          addition = marker + '''
              - name: Verify Beta channel manifest sync
                run: python3 scripts/verify_beta_channel_manifest_sync.py
          '''
          if 'Verify Beta channel manifest sync' not in source:
              if source.count(marker) != 1:
                  raise SystemExit('sign workflow insertion marker mismatch')
              source = source.replace(marker, addition, 1)
          Path('.github/workflows/sign-toolhub.yml').write_text(source, encoding='utf-8')
          PY

      - name: Regenerate audits
        shell: bash
        run: |
          python3 scripts/report_dead_module_symbols.py --write docs/audits/DEAD_CODE_AUDIT.md
          python3 scripts/report_protected_wrapper_chains.py --write docs/audits/PROTECTED_WRAPPER_AUDIT.md
          python3 scripts/report_module_symbol_audits.py --write docs/audits/MODULE_SYMBOL_AUDIT.md
          python3 scripts/report_entry_symbols.py --write docs/audits/ENTRY_SYMBOL_AUDIT.md

      - name: Verify reviewed fix
        shell: bash
        run: |
          python3 .github/scripts/es5_scan.py
          python3 scripts/verify_js_syntax.py
          python3 scripts/verify_module_boundaries.py
          python3 scripts/verify_api_usage_policy.py
          python3 scripts/verify_coloros_rhino_color_safety.py
          python3 scripts/verify_rhino_color_api_safety.py
          python3 scripts/verify_main_panel_close_lifecycle.py
          python3 scripts/verify_shortx_ui_windowhost.py
          python3 scripts/verify_beta_channel_manifest_sync.py
          python3 scripts/verify_update_history.py --require-one-pending
          python3 scripts/report_dead_module_symbols.py --check docs/audits/DEAD_CODE_AUDIT.md
          python3 scripts/report_protected_wrapper_chains.py --check docs/audits/PROTECTED_WRAPPER_AUDIT.md
          python3 scripts/report_module_symbol_audits.py --check docs/audits/MODULE_SYMBOL_AUDIT.md
          python3 scripts/report_entry_symbols.py --check docs/audits/ENTRY_SYMBOL_AUDIT.md
          git diff --check

      - name: Commit formal fix directly to beta
        shell: bash
        env:
          TOOLHUB_AUTOMATION_TOKEN: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}
        run: |
          if [ -z "$TOOLHUB_AUTOMATION_TOKEN" ]; then
            echo "TOOLHUB_AUTOMATION_TOKEN is empty"
            exit 1
          fi
          rm -f \
            .github/workflows/beta-mask-toolapp-zorder-fix.yml \
            .github/workflows/beta-mask-toolapp-zorder-runner.yml \
            scripts/apply_beta_mask_toolapp_zorder_fix.py \
            scripts/.beta-mask-toolapp-zorder-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修复 Beta ToolApp 全屏遮罩阻塞"
          git remote set-url origin "https://x-access-token:${TOOLHUB_AUTOMATION_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:beta
