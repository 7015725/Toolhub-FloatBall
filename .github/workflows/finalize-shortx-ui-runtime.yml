name: finalize-shortx-ui-runtime

on:
  push:
    branches: [agent/finalize-shortx-ui-runtime]
    paths:
      - scripts/finalize_shortx_ui_runtime.py
      - updates/records/20260728-beta-shortx-ui-final-package.json
      - .github/workflows/finalize-shortx-ui-runtime.yml
  pull_request:
    branches: [beta]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - scripts/finalize_shortx_ui_runtime.py
      - updates/records/20260728-beta-shortx-ui-final-package.json
      - .github/workflows/finalize-shortx-ui-runtime.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: finalize-shortx-ui-runtime
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: agent/finalize-shortx-ui-runtime
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Normalize finalizer contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/finalize_shortx_ui_runtime.py")
          text = path.read_text(encoding="utf-8")

          start_old = '''    var oldStartAsyncShortXUiPackage = currentStartAsync;
              var wrappedStartAsyncShortXUiPackage = function (entryInfo, closeRule) {
                var result = oldStartAsyncShortXUiPackage.call(this, entryInfo, closeRule);
                if (!result || result.ok !== true) return result;
                try {
                  var packageResult = install(this);
                  result.shortXUiPackage = packageResult;
                  return result;
                } catch (error) {
                  try { if (this && typeof this.close === "function") this.close(); } catch (eClose) {}
                  return {
                    ok: false,
                    started: false,
                    err: "ShortXUI package install failed: " + String(error),
                    shortXUiPackage: {
                      ok: false,
                      version: PACKAGE_VERSION,
                      error: String(error)
                    }
                  };
                }
              };
              wrappedStartAsyncShortXUiPackage.__toolHubShortXUiPackageWrapped = true;
              proto.startAsync = wrappedStartAsyncShortXUiPackage;
          '''
          start_new = '''    var oldStartAsyncShortXUiPackage = currentStartAsync;
              proto.startAsync = function (entryInfo, closeRule) {
                var result = oldStartAsyncShortXUiPackage.call(this, entryInfo, closeRule);
                if (!result || result.ok !== true) return result;
                try {
                  var packageResult = install(this);
                  result.shortXUiPackage = packageResult;
                  return result;
                } catch (error) {
                  try { if (this && typeof this.close === "function") this.close(); } catch (eClose) {}
                  return {
                    ok: false,
                    started: false,
                    err: "ShortXUI package install failed: " + String(error),
                    shortXUiPackage: {
                      ok: false,
                      version: PACKAGE_VERSION,
                      error: String(error)
                    }
                  };
                }
              };
              proto.startAsync.__toolHubShortXUiPackageWrapped = true;
          '''
          if start_old not in text:
              raise SystemExit("startAsync wrapper source anchor missing")
          text = text.replace(start_old, start_new, 1)

          architecture_old = '''def patch_architecture(text: str) -> str:
              text = text.replace("更新时间：2026-07-27", "更新时间：2026-07-28", 1)
              text = text.replace("31 个子模块", "32 个子模块")
              source = "  th_23_screenshot_manager.js\\n```"
              target = (
                  "  th_23_screenshot_manager.js\\n\\n"
                  "最终封装层\\n"
                  "  th_25_shortx_ui_package.js\\n```"
              )
              text = replace_once(text, source, target, "architecture module list")
              if "\\nth_25_shortx_ui_package.js\\n" not in text:
                  insertion_anchor = "th_23_screenshot_manager.js\\n"
                  idx = text.find(insertion_anchor)
                  if idx < 0:
                      fail("architecture th_23 description missing")
                  end = text.find("\\n\\n", idx)
                  if end < 0:
                      fail("architecture th_23 paragraph terminator missing")
                  addition = (
                      "\\n\\nth_25_shortx_ui_package.js\\n"
                      "  Beta 最终 ShortXUI 封装模块。保存 Phase 2 至 Final R3 的确定性压缩源码和逐项 SHA-256，"
                      "仅在 `startAsync()` 成功后按已验收顺序安装；安装失败立即关闭当前实例并返回启动失败。"
                  )
                  text = text[:end] + addition + text[end:]
              boundary = (
                  "th_34_shortx_ui_lab.js\\n"
                  "  Beta 专用 ShortX UI 实验室 ToolApp 页面，提供基础环境、颜色、Shape 与 Android Main/ToolHub WM Dispatcher 自检；"
                  "实验异常不替换悬浮球、主面板、WindowManager、IME、Canvas、指针或 OCR 路径。"
              )
              if boundary in text:
                  text = text.replace(
                      boundary,
                      "th_34_shortx_ui_lab.js\\n"
                      "  Beta 专用 ShortX UI 实验室 ToolApp 页面，保留基础环境、线程、WindowHost 和最终验收诊断入口；"
                      "正式 IME、返回、Canvas、API 与生命周期能力由 `th_25_shortx_ui_package.js` 在启动成功后统一安装。",
                      1,
                  )
              return text
          '''
          architecture_new = '''def patch_architecture(text: str) -> str:
              text = text.replace("更新时间：2026-07-27", "更新时间：2026-07-28", 1)
              text = text.replace("31 个子模块", "32 个子模块")
              source = "  th_23_screenshot_manager.js\\n```"
              target = (
                  "  th_23_screenshot_manager.js\\n\\n"
                  "最终封装层\\n"
                  "  th_25_shortx_ui_package.js\\n```"
              )
              text = replace_once(text, source, target, "architecture module list")
              responsibility_source = (
                  "th_24_shortx_ui_runtime.js\\n"
                  "  Beta 隔离的 ShortXUI 第一阶段基础运行时，提供 Core、Dispatcher、Scope、Color、Metrics、Display、Shape 和 Diagnostics；颜色操作通过已验证的 ToolHub 安全桥注入，不接管正式 UI。\\n\\n"
                  "th_03_icon.js"
              )
              responsibility_target = (
                  "th_24_shortx_ui_runtime.js\\n"
                  "  Beta 隔离的 ShortXUI 第一阶段基础运行时，提供 Core、Dispatcher、Scope、Color、Metrics、Display、Shape 和 Diagnostics；颜色操作通过已验证的 ToolHub 安全桥注入，不接管正式 UI。\\n\\n"
                  "th_25_shortx_ui_package.js\\n"
                  "  Beta 最终 ShortXUI 封装模块。保存 Phase 2 至 Final R3 的确定性压缩源码和逐项 SHA-256，仅在 `startAsync()` 成功后按已验收顺序安装；安装失败立即关闭当前实例并返回启动失败。\\n\\n"
                  "th_03_icon.js"
              )
              text = replace_once(text, responsibility_source, responsibility_target, "architecture package responsibility")
              boundary = (
                  "th_34_shortx_ui_lab.js\\n"
                  "  Beta 专用 ShortX UI 实验室 ToolApp 页面，提供基础环境、颜色、Shape 与 Android Main/ToolHub WM Dispatcher 自检；"
                  "实验异常不替换悬浮球、主面板、WindowManager、IME、Canvas、指针或 OCR 路径。"
              )
              if boundary in text:
                  text = text.replace(
                      boundary,
                      "th_34_shortx_ui_lab.js\\n"
                      "  Beta 专用 ShortX UI 实验室 ToolApp 页面，保留基础环境、线程、WindowHost 和最终验收诊断入口；"
                      "正式 IME、返回、Canvas、API 与生命周期能力由 `th_25_shortx_ui_package.js` 在启动成功后统一安装。",
                      1,
                  )
              return text
          '''
          if architecture_old not in text:
              raise SystemExit("architecture finalizer source anchor missing")
          text = text.replace(architecture_old, architecture_new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Generate final package
        run: python3 scripts/finalize_shortx_ui_runtime.py

      - name: Generate API baseline
        run: python3 scripts/generate_api_usage_baseline.py

      - name: Generate dead-code audit
        run: python3 scripts/report_dead_module_symbols.py --write docs/audits/DEAD_CODE_AUDIT.md

      - name: Generate protected-wrapper audit
        run: python3 scripts/report_protected_wrapper_chains.py --write docs/audits/PROTECTED_WRAPPER_AUDIT.md

      - name: Generate module-symbol audit
        run: python3 scripts/report_module_symbol_audits.py --write docs/audits/MODULE_SYMBOL_AUDIT.md

      - name: Generate entry-symbol audit
        run: python3 scripts/report_entry_symbols.py --write docs/audits/ENTRY_SYMBOL_AUDIT.md

      - name: Verify generated package
        run: python3 scripts/finalize_shortx_ui_runtime.py --check

      - name: Verify ES5
        run: python3 .github/scripts/es5_scan.py

      - name: Verify JavaScript syntax
        run: python3 scripts/verify_js_syntax.py

      - name: Verify module boundaries
        run: python3 scripts/verify_module_boundaries.py

      - name: Verify API policy
        run: python3 scripts/verify_api_usage_policy.py

      - name: Verify documentation
        run: python3 scripts/verify_documentation_consistency.py

      - name: Verify whitespace
        run: git diff --check

      - name: Commit generated closure
        shell: bash
        run: |
          rm -f .github/workflows/finalize-shortx-ui-runtime.yml
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "toolhub-automation"
          git config user.email "toolhub-automation@users.noreply.github.com"
          git add -A
          git commit -m "封装 ShortXUI 最终 R3 运行时"
          git push origin HEAD:agent/finalize-shortx-ui-runtime
