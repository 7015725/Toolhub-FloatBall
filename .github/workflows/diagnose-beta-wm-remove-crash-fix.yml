name: diagnose-beta-wm-remove-crash-fix

on:
  pull_request:
    branches:
      - beta
    types: [synchronize]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/beta-fix-wm-remove-view-crash-20260726'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta-fix-wm-remove-view-crash-20260726
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}

      - name: Capture exact replacement failure
        shell: bash
        run: |
          python3 - <<'PYEXTRACT'
          from pathlib import Path
          source = Path('.github/workflows/apply-beta-wm-remove-crash-fix.yml').read_text(encoding='utf-8')
          begin_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n"
          begin = source.index(begin_marker)
          end = source.index(end_marker, begin) + len(end_marker)
          block = source[begin:end]
          lines = []
          for line in block.splitlines():
              if not line.startswith('          '):
                  raise SystemExit('unexpected repair-script indentation: ' + line)
              lines.append(line[10:])
          Path('/tmp/apply-beta-wm-remove-crash-fix.sh').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PYEXTRACT
          set +e
          bash /tmp/apply-beta-wm-remove-crash-fix.sh > /tmp/wm-fix-apply.log 2>&1
          code=$?
          set -e
          mkdir -p diagnostics
          {
            echo "exit_code=$code"
            cat /tmp/wm-fix-apply.log
          } > diagnostics/wm-fix-apply-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-beta-wm-remove-crash-fix.yml
          git add diagnostics/wm-fix-apply-error.txt
          git commit -m "记录 WindowManager 修复脚本失败点"
          git push origin HEAD:agent/beta-fix-wm-remove-view-crash-20260726
