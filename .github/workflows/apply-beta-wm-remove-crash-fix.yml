name: apply-beta-wm-remove-crash-fix

on:
  push:
    branches:
      - agent/beta-fix-wm-remove-view-crash-20260726

permissions:
  contents: write

concurrency:
  group: apply-beta-wm-remove-crash-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta-fix-wm-remove-view-crash-20260726
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply deferred WindowManager removal fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path.cwd()

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit("%s replacement count=%d" % (label, count))
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          animation = ROOT / "code" / "th_09_animation.js"
          entry = ROOT / "code" / "th_16_entry.js"

          replace_once(
              animation,
              "// @version 1.0.12",
              "// @version 1.0.13",
              "th_09 version",
          )
          replace_once(
              animation,
              "    var keepInvisible = opts.keepInvisible === true;\n"
              "    var resetVisual = opts.resetVisual !== false;\n"
              "    var immediate = opts.immediate === true || !!(this.state && this.state.closing);",
              "    var keepInvisible = opts.keepInvisible === true;\n"
              "    var resetVisual = opts.resetVisual !== false;\n"
              "    var requestedImmediate = opts.immediate === true || !!(this.state && this.state.closing);\n"
              "    // ToolHub 运行在 system_server；同步销毁 ViewRoot 会把 ColorOS/Xposed Hook 嵌套在 Rhino 回调栈中。\n"
              "    // 所有窗口统一提交普通 removeView，让真正的 Surface 销毁跨越当前消息边界。\n"
              "    var immediate = false;",
              "safeRemoveView mode",
          )
          replace_once(
              animation,
              "    if (immediate && this.state.wm.removeViewImmediate) {\n"
              "      this.state.wm.removeViewImmediate(v);\n"
              "    } else {\n"
              "      this.state.wm.removeView(v);\n"
              "    }",
              "    this.state.wm.removeView(v);",
              "safeRemoveView deferred removal",
          )
          replace_once(
              animation,
              "      immediate: immediate,\n"
              "      resetVisual: resetVisual,",
              "      immediate: immediate,\n"
              "      requestedImmediate: requestedImmediate,\n"
              "      resetVisual: resetVisual,",
              "safeRemoveView result",
          )
          replace_once(
              animation,
              "  var self = this;\n"
              "  var panel = this.state.panel;\n"
              "  var shouldAnimate = !(",
              "  var self = this;\n"
              "  var panel = this.state.panel;\n"
              "  var toolAppGenerationAtHide = Number(this.state.toolAppUiGeneration || 0);\n"
              "  var shouldAnimate = !(",
              "main panel ToolApp generation capture",
          )
          replace_once(
              animation,
              "    // 捕获到的旧 View 无论是否仍是当前面板，都必须移除。\n"
              "    // 先保持不可见，跳过预测性返回视觉复位，并立即提交 WindowManager 移除。",
              "    // 捕获到的旧 View 无论是否仍是当前面板，都必须移除。\n"
              "    // 先保持不可见，跳过预测性返回视觉复位，再提交普通移除并跨消息边界销毁 ViewRoot。",
              "main panel removal comment",
          )
          replace_once(
              animation,
              "    var removeResult = self.safeRemoveView(panel, \"panel\", {\n"
              "      immediate: true,",
              "    var removeResult = self.safeRemoveView(panel, \"panel\", {\n"
              "      immediate: false,",
              "main panel deferred remove",
          )
          replace_once(
              animation,
              "  var removeResult = this.safeRemoveView(mask, \"mask\", {\n"
              "    immediate: true,",
              "  var removeResult = this.safeRemoveView(mask, \"mask\", {\n"
              "    immediate: false,",
              "mask deferred remove",
          )
          replace_once(
              animation,
              "    if (isLatest) {\n"
              "      self.state.mainPanelExitAnimating = false;\n"
              "      if (self.hideMaskIfNoPanelVisible) self.hideMaskIfNoPanelVisible(\"main_panel_exit\");\n"
              "      else if (!self.state.addedPanel &&\n"
              "               !self.state.addedSettings &&\n"
              "               !self.state.addedViewer) self.hideMask();\n"
              "      self.touchActivity();\n"
              "      self._clearHeavyCachesIfAllHidden(\"hideMainPanel\");\n"
              "    }",
              "    if (isLatest) {\n"
              "      self.state.mainPanelExitAnimating = false;\n"
              "      // 延后一轮清理共享遮罩：主面板点击“设置”等入口会在当前回调末尾增加\n"
              "      // toolAppUiGeneration，届时保留原 mask 给 ToolApp 复用，避免 remove/add 竞态。\n"
              "      var maskCleanup = new java.lang.Runnable({ run: function() {\n"
              "        try {\n"
              "          if (!self.state) return;\n"
              "          if (Number(self.state.toolAppUiGeneration || 0) !== toolAppGenerationAtHide) {\n"
              "            safeLog(self.L, 'd', \"main panel mask cleanup skipped for toolapp transition\");\n"
              "            return;\n"
              "          }\n"
              "          if (self.hideMaskIfNoPanelVisible) self.hideMaskIfNoPanelVisible(\"main_panel_exit\");\n"
              "          else if (!self.state.addedPanel &&\n"
              "                   !self.state.addedSettings &&\n"
              "                   !self.state.addedViewer) self.hideMask();\n"
              "        } catch (eMaskCleanup) {\n"
              "          safeLog(self.L, 'w', \"main panel deferred mask cleanup fail: \" + String(eMaskCleanup));\n"
              "        }\n"
              "      }});\n"
              "      var maskCleanupPosted = false;\n"
              "      try {\n"
              "        if (self.state.h) maskCleanupPosted = self.state.h.post(maskCleanup) === true;\n"
              "      } catch (eMaskPost) {}\n"
              "      if (!maskCleanupPosted) maskCleanup.run();\n"
              "      self.touchActivity();\n"
              "      self._clearHeavyCachesIfAllHidden(\"hideMainPanel\");\n"
              "    }",
              "deferred mask cleanup",
          )

          animation_text = animation.read_text(encoding="utf-8")
          if "removeViewImmediate" in animation_text:
              raise SystemExit("th_09_animation.js still contains removeViewImmediate")

          replace_once(
              entry,
              "// @version 1.0.17",
              "// @version 1.0.18",
              "th_16 version",
          )
          replace_once(
              entry,
              "  } catch (eShow) {\n"
              "    this.state.toolAppActive = false;\n"
              "    safeLog(this.L, 'e', \"showToolAppOnMain fail route=\" + r + \" err=\" + String(eShow));\n"
              "    try { this.toast(\"设置页面显示失败: \" + String(eShow)); } catch (eToast) {}\n"
              "  }",
              "  } catch (eShow) {\n"
              "    this.state.toolAppActive = false;\n"
              "    safeLog(this.L, 'e', \"showToolAppOnMain fail route=\" + r + \" err=\" + String(eShow));\n"
              "    var selfBuildFail = this;\n"
              "    try {\n"
              "      this.postToToolHubWm(function() {\n"
              "        try { selfBuildFail.hideMaskIfNoPanelVisible(\"toolapp_build_fail\"); } catch (eMaskRollback) {}\n"
              "      });\n"
              "    } catch (ePostRollback) {}\n"
              "    try { this.toast(\"设置页面显示失败: \" + String(eShow)); } catch (eToast) {}\n"
              "  }",
              "ToolApp build failure mask rollback",
          )
          replace_once(
              entry,
              "    try { root.animate().cancel(); } catch (eAnim) {}\n"
              "    try { root.clearAnimation(); } catch (eClear) {}\n"
              "    try {",
              "    try { root.animate().cancel(); } catch (eAnim) {}\n"
              "    try { root.clearAnimation(); } catch (eClear) {}\n"
              "    try { root.setVisibility(android.view.View.INVISIBLE); } catch (eInvisible) {}\n"
              "    try { root.setAlpha(0); } catch (eAlpha) {}\n"
              "    try {",
              "ToolApp invisible before removal",
          )
          replace_once(
              entry,
              "    try {\n"
              "      if ((immediate === true || s.closing) && s.wm.removeViewImmediate) {\n"
              "        s.wm.removeViewImmediate(root);\n"
              "      } else {\n"
              "        s.wm.removeView(root);\n"
              "      }\n"
              "    } catch (eRemove) {\n"
              "      try { s.wm.removeViewImmediate(root); }\n"
              "      catch (eFallback) {\n"
              "        safeLog(this.L, 'w', \"toolapp remove fail: \" + String(eRemove) +\n"
              "          \"; fallback=\" + String(eFallback));\n"
              "      }\n"
              "    }",
              "    try {\n"
              "      // 即使是 ToolHub 全局关闭也只提交普通移除；Android 主线程继续存活，\n"
              "      // ViewRoot 会在主消息队列中完成 detach，不再嵌套进当前 Rhino/Xposed 调用栈。\n"
              "      s.wm.removeView(root);\n"
              "    } catch (eRemove) {\n"
              "      safeLog(this.L, 'w', \"toolapp deferred remove fail: \" + String(eRemove));\n"
              "    }",
              "ToolApp deferred remove",
          )

          entry_text = entry.read_text(encoding="utf-8")
          remove_start = entry_text.index("FloatBallAppWM.prototype.removeToolAppOnMain = function")
          remove_block = entry_text[remove_start:]
          if "removeViewImmediate" in remove_block:
              raise SystemExit("removeToolAppOnMain still contains removeViewImmediate")

          verifier = ROOT / "scripts" / "verify_main_panel_close_lifecycle.py"
          verifier.write_text(r'''#!/usr/bin/env python3
          # 验证 system_server 中主面板、共享遮罩和 ToolApp 仅使用跨消息边界的普通移除。

          from pathlib import Path
          import re

          ROOT = Path(__file__).resolve().parents[1]
          ANIMATION_PATH = ROOT / "code" / "th_09_animation.js"
          ENTRY_PATH = ROOT / "code" / "th_16_entry.js"
          MAIN_PANEL_PATH = ROOT / "code" / "th_15_main_panel.js"
          WORKFLOW_PATH = ROOT / ".github" / "workflows" / "verify.yml"

          ANIMATION = ANIMATION_PATH.read_text(encoding="utf-8")
          ENTRY = ENTRY_PATH.read_text(encoding="utf-8")
          MAIN_PANEL = MAIN_PANEL_PATH.read_text(encoding="utf-8")
          WORKFLOW = WORKFLOW_PATH.read_text(encoding="utf-8")

          def fail(message):
              raise SystemExit("FAIL main-panel-close-lifecycle: " + message)

          def version_at_least(text, expected):
              match = re.search(r"(?m)^// @version ([0-9]+)\.([0-9]+)\.([0-9]+)$", text)
              return bool(match) and tuple(map(int, match.groups())) >= expected

          def isolate(text, start_marker, end_marker):
              start = text.find(start_marker)
              end = text.find(end_marker, start + 1)
              if start < 0 or end <= start:
                  fail("cannot isolate %s" % start_marker)
              return text[start:end]

          if not version_at_least(ANIMATION, (1, 0, 13)):
              fail("expected th_09_animation.js >= 1.0.13")
          if not version_at_least(ENTRY, (1, 0, 18)):
              fail("expected th_16_entry.js >= 1.0.18")
          if "// @version 1.5.8" not in MAIN_PANEL:
              fail("main panel UI module must remain unchanged")

          safe = isolate(
              ANIMATION,
              "FloatBallAppWM.prototype.safeRemoveView = function",
              "FloatBallAppWM.prototype.hideMask = function",
          )
          if "removeViewImmediate" in safe:
              fail("safeRemoveView must not synchronously destroy ViewRoot")
          for marker in (
              "var requestedImmediate = opts.immediate === true",
              "var immediate = false",
              "v.setVisibility(android.view.View.INVISIBLE)",
              "v.setAlpha(0)",
              "this.unregisterPanelPredictiveBack(v, resetVisual)",
              "this.state.wm.removeView(v)",
              "requestedImmediate: requestedImmediate",
          ):
              if marker not in safe:
                  fail("safeRemoveView missing: %s" % marker)

          hide_main = isolate(
              ANIMATION,
              "FloatBallAppWM.prototype.hideMainPanel = function",
              "FloatBallAppWM.prototype.hideSettingsPanel = function",
          )
          for marker in (
              "mainPanelExitGeneration",
              "var finished = false",
              "isCurrent = self.state.panel === panel",
              "immediate: false",
              "resetVisual: false",
              "keepInvisible: true",
              "toolAppGenerationAtHide",
              "main panel mask cleanup skipped for toolapp transition",
              "self.state.h.post(maskCleanup)",
          ):
              if marker not in hide_main:
                  fail("hideMainPanel missing: %s" % marker)

          hide_mask = isolate(
              ANIMATION,
              "FloatBallAppWM.prototype.hideMask = function",
              "FloatBallAppWM.prototype.hideMaskIfNoPanelVisible = function",
          )
          if "immediate: false" not in hide_mask:
              fail("mask must use deferred removal")

          tool_remove = ENTRY[ENTRY.find("FloatBallAppWM.prototype.removeToolAppOnMain = function"):]
          if "removeViewImmediate" in tool_remove:
              fail("ToolApp removal must not call removeViewImmediate")
          for marker in (
              "root.setVisibility(android.view.View.INVISIBLE)",
              "root.setAlpha(0)",
              "s.wm.removeView(root)",
              "toolapp deferred remove fail",
              "hideMaskIfNoPanelVisible(\"toolapp_build_fail\")",
          ):
              if marker not in ENTRY:
                  fail("ToolApp lifecycle missing: %s" % marker)

          if "python3 scripts/verify_main_panel_close_lifecycle.py" not in WORKFLOW:
              fail("workflow verification missing")
          if "var TOOLHUB_ENTRY_VERSION = 20260721201500;" not in (ROOT / "ToolHub.js").read_text(encoding="utf-8"):
              fail("entry version changed unexpectedly")

          for path in (ANIMATION_PATH, ENTRY_PATH, verifier if False else ANIMATION_PATH):
              raw = path.read_bytes()
              if not raw.endswith(b"\n") or raw.endswith(b"\n\n"):
                  fail("invalid EOF: %s" % path.relative_to(ROOT))

          print(
              "OK main_panel_close_lifecycle deferred_remove=1 "
              "main_mask=toolapp_generation_guarded toolapp_failure=mask_rollback"
          )
          ''').read_text(encoding="utf-8").replace("\n          ", "\n").lstrip(), encoding="utf-8")

          pending = {
              "schema": 1,
              "id": "20260726-beta-system-server-window-remove-crash",
              "type": "fix",
              "title": "修复 WindowManager 同步移除导致的 system_server 重启",
              "details": [
                  "主面板和共享遮罩保持 INVISIBLE、alpha=0、返回回调注销及 generation/identity 保护，但统一改为普通 removeView，让 ViewRoot 和 Surface 销毁跨越当前 Rhino 点击消息边界。",
                  "主面板关闭后的遮罩清理由同一 WM HandlerThread 延后一轮执行；检测到 ToolApp UI generation 已变化时复用原遮罩，避免设置切页中的 remove/add 竞态。",
                  "ToolApp 在 Android 主线程关闭时先隐藏、清除焦点和输入法，再使用普通 removeView；删除全局关闭和异常回退中的 removeViewImmediate。",
                  "ToolApp 创建失败时回投 WM HandlerThread 清理无所有者遮罩，避免 generation 保护造成遮罩残留。",
                  "不修改主面板布局、按钮数据、SQLite、Stable/Beta 通道、入口文件和现有线程归属。"
              ],
              "manifestVersion": 0
          }
          record = ROOT / "updates" / "records" / (pending["id"] + ".json")
          record.write_text(json.dumps(pending, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Refresh deterministic audits
        shell: bash
        run: |
          python3 scripts/report_dead_module_symbols.py --write docs/audits/DEAD_CODE_AUDIT.md
          python3 scripts/report_protected_wrapper_chains.py --write docs/audits/PROTECTED_WRAPPER_AUDIT.md
          python3 scripts/report_module_symbol_audits.py --write docs/audits/MODULE_SYMBOL_AUDIT.md

      - name: Run targeted verification
        shell: bash
        run: |
          python3 .github/scripts/es5_scan.py
          python3 scripts/verify_js_syntax.py
          python3 scripts/verify_main_panel_close_lifecycle.py
          python3 scripts/verify_toolapp_main_thread_affinity.py
          python3 scripts/verify_update_history.py --require-one-pending
          git diff --check

      - name: Commit repair and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-beta-wm-remove-crash-fix.yml
          git add code/th_09_animation.js code/th_16_entry.js \
            scripts/verify_main_panel_close_lifecycle.py \
            docs/audits/DEAD_CODE_AUDIT.md \
            docs/audits/PROTECTED_WRAPPER_AUDIT.md \
            docs/audits/MODULE_SYMBOL_AUDIT.md \
            updates/records/20260726-beta-system-server-window-remove-crash.json
          git commit -m "修复 WindowManager 同步移除导致的系统重启"
          git push origin HEAD:agent/beta-fix-wm-remove-view-crash-20260726
