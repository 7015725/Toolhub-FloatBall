name: refresh-entry-symbol-audit

on:
  pull_request:
    branches: [beta]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: refresh-entry-symbol-audit
  cancel-in-progress: true

jobs:
  refresh:
    if: github.head_ref == 'agent/beta-fix-wm-remove-view-crash-20260726'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta-fix-wm-remove-view-crash-20260726
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Refresh deterministic entry audit
        run: |
          python3 scripts/report_entry_symbols.py --write docs/audits/ENTRY_SYMBOL_AUDIT.md
          python3 scripts/report_entry_symbols.py --check docs/audits/ENTRY_SYMBOL_AUDIT.md

      - name: Verify entry and release boundaries
        run: |
          set -eo pipefail
          python3 .github/scripts/es5_scan.py
          python3 scripts/verify_js_syntax.py
          python3 scripts/verify_code_constraints.py --output code-constraint-report.json
          python3 scripts/verify_entry_redundancy_cleanup.py
          python3 scripts/verify_entry_lifecycle.py
          python3 scripts/verify_github_only_source.py
          python3 scripts/verify_update_security_mode.py
          python3 scripts/verify_main_panel_close_lifecycle.py
          python3 scripts/verify_update_history.py
          python3 scripts/verify_manifest.py
          python3 .github/scripts/verify_manifest_signature.py
          git diff --check

      - name: Commit audit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-entry-symbol-audit.yml
          git add docs/audits/ENTRY_SYMBOL_AUDIT.md
          git commit -m "刷新修复入口符号审计"
          git push origin HEAD:agent/beta-fix-wm-remove-view-crash-20260726
