name: diagnose-beta-wm-remove-crash-comment

on:
  pull_request:
    branches:
      - beta
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/beta-fix-wm-remove-view-crash-20260726'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta-fix-wm-remove-view-crash-20260726
          fetch-depth: 0

      - name: Run replacement script and publish exact failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYEXTRACT'
          from pathlib import Path
          source = Path('.github/workflows/apply-beta-wm-remove-crash-fix.yml').read_text(encoding='utf-8')
          begin_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n"
          begin = source.index(begin_marker)
          end = source.index(end_marker, begin) + len(end_marker)
          block = source[begin:end]
          lines = []
          for line in block.splitlines():
              if not line.startswith('          '):
                  raise SystemExit('unexpected repair-script indentation: ' + line)
              lines.append(line[10:])
          Path('/tmp/apply-beta-wm-remove-crash-fix.sh').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PYEXTRACT
          set +e
          bash /tmp/apply-beta-wm-remove-crash-fix.sh > /tmp/wm-fix-apply.log 2>&1
          code=$?
          set -e
          {
            echo '### WindowManager 修复脚本诊断'
            echo
            echo '```text'
            echo "exit_code=$code"
            cat /tmp/wm-fix-apply.log
            echo '```'
          } > /tmp/pr-comment.md
          gh pr comment 416 --repo 7015725/Toolhub-FloatBall --body-file /tmp/pr-comment.md
