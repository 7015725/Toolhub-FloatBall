name: beta-shortx-ui-bootstrap

on:
  pull_request:
    branches: [beta]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: beta-shortx-ui-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-entry:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/beta-shortx-ui-runtime-phase1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN || github.token }}
          persist-credentials: false

      - name: Apply beta ShortXUI release patch
        run: |
          python3 scripts/apply_beta_shortx_ui_modules.py
          python3 scripts/prepare_shortx_ui_constraints.py
          python3 scripts/report_dead_module_symbols.py --write docs/audits/DEAD_CODE_AUDIT.md
          python3 scripts/report_protected_wrapper_chains.py --write docs/audits/PROTECTED_WRAPPER_AUDIT.md
          python3 scripts/report_module_symbol_audits.py --write docs/audits/MODULE_SYMBOL_AUDIT.md
          python3 scripts/report_entry_symbols.py --write docs/audits/ENTRY_SYMBOL_AUDIT.md

      - name: Verify generated release patch
        shell: bash
        run: |
          grep -q 'th_24_shortx_ui_runtime.js' ToolHub.js
          grep -q 'th_34_shortx_ui_lab.js' ToolHub.js
          grep -q 'th_24_shortx_ui_runtime.js' scripts/generate_signed_manifest.py
          grep -q 'th_34_shortx_ui_lab.js' scripts/generate_signed_manifest.py
          grep -q '^// @version 0.1.3$' code/th_24_shortx_ui_runtime.js
          grep -q '^// @version 0.1.1$' code/th_34_shortx_ui_lab.js
          ! grep -q 'ColorStateList.valueOf(' code/th_24_shortx_ui_runtime.js
          ! grep -q 'new ColorStateList(' code/th_24_shortx_ui_runtime.js
          python3 .github/scripts/es5_scan.py
          python3 scripts/verify_js_syntax.py
          python3 scripts/verify_module_boundaries.py
          python3 scripts/verify_api_usage_policy.py
          python3 scripts/report_api_usage.py --check constraints/API_USAGE_BASELINE.json
          python3 scripts/verify_coloros_rhino_color_safety.py
          python3 scripts/verify_rhino_color_api_safety.py
          python3 scripts/report_dead_module_symbols.py --check docs/audits/DEAD_CODE_AUDIT.md
          python3 scripts/report_protected_wrapper_chains.py --check docs/audits/PROTECTED_WRAPPER_AUDIT.md
          python3 scripts/report_module_symbol_audits.py --check docs/audits/MODULE_SYMBOL_AUDIT.md
          python3 scripts/report_entry_symbols.py --check docs/audits/ENTRY_SYMBOL_AUDIT.md

      - name: Commit generated release patch
        shell: bash
        env:
          TOOLHUB_AUTOMATION_TOKEN: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}
        run: |
          TRACKED_FILES="ToolHub.js scripts/generate_signed_manifest.py code/th_24_shortx_ui_runtime.js code/th_34_shortx_ui_lab.js constraints/MODULE_BOUNDARIES.json constraints/api.json constraints/API_USAGE_BASELINE.json scripts/report_protected_wrapper_chains.py docs/audits/DEAD_CODE_AUDIT.md docs/audits/PROTECTED_WRAPPER_AUDIT.md docs/audits/MODULE_SYMBOL_AUDIT.md docs/audits/ENTRY_SYMBOL_AUDIT.md"
          if git diff --quiet -- $TRACKED_FILES; then
            echo "Beta ShortXUI release already patched"
            exit 0
          fi
          if [ -z "$TOOLHUB_AUTOMATION_TOKEN" ]; then
            echo "TOOLHUB_AUTOMATION_TOKEN is empty"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $TRACKED_FILES
          git commit -m "Beta：更新 ShortXUI 约束审计基线"
          git remote set-url origin "https://x-access-token:${TOOLHUB_AUTOMATION_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
