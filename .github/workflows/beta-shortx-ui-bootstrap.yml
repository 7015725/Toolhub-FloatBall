name: beta-shortx-ui-bootstrap

on:
  pull_request:
    branches: [beta]
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: beta-shortx-ui-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup-windowhost-bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/beta-shortx-ui-windowhost-phase2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN || github.token }}
          persist-credentials: false

      - name: Remove phase-2 bootstrap files
        shell: bash
        env:
          TOOLHUB_AUTOMATION_TOKEN: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}
        run: |
          rm -f scripts/apply_beta_shortx_ui_windowhost_patch.py
          rm -f scripts/apply_beta_shortx_ui_windowhost_phase2.py
          rm -f scripts/bootstrap/shortx_ui_windowhost_phase2.part*
          rm -f scripts/bootstrap/windowhost_phase2_patch.part*
          rm -f .github/workflows/beta-shortx-ui-bootstrap.yml
          if git diff --quiet; then
            echo "No phase-2 bootstrap files remain"
            exit 0
          fi
          if [ -z "$TOOLHUB_AUTOMATION_TOKEN" ]; then
            echo "TOOLHUB_AUTOMATION_TOKEN is empty"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Beta：清理 ShortXUI WindowHost 阶段性生成文件"
          git remote set-url origin "https://x-access-token:${TOOLHUB_AUTOMATION_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
