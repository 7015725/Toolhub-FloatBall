name: beta-shortx-ui-bootstrap

on:
  pull_request:
    branches: [beta]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: beta-shortx-ui-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-entry:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/beta-shortx-ui-runtime-phase1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN || github.token }}
          persist-credentials: false

      - name: Apply beta module list
        run: python3 scripts/apply_beta_shortx_ui_modules.py

      - name: Verify entry patch
        shell: bash
        run: |
          grep -q 'th_24_shortx_ui_runtime.js' ToolHub.js
          grep -q 'th_34_shortx_ui_lab.js' ToolHub.js
          python3 .github/scripts/es5_scan.py
          python3 scripts/verify_js_syntax.py

      - name: Commit entry patch
        shell: bash
        env:
          TOOLHUB_AUTOMATION_TOKEN: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}
        run: |
          if git diff --quiet -- ToolHub.js; then
            echo "ToolHub.js already patched"
            exit 0
          fi
          if [ -z "$TOOLHUB_AUTOMATION_TOKEN" ]; then
            echo "TOOLHUB_AUTOMATION_TOKEN is empty"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ToolHub.js
          git commit -m "Beta：接入 ShortXUI 实验模块"
          git remote set-url origin "https://x-access-token:${TOOLHUB_AUTOMATION_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
