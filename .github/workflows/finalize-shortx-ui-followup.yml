name: finalize-shortx-ui-followup

on:
  push:
    branches: [agent/finalize-shortx-ui-runtime]
    paths:
      - .github/workflows/finalize-shortx-ui-followup.yml
  pull_request:
    branches: [beta]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/finalize-shortx-ui-followup.yml

permissions:
  contents: write

concurrency:
  group: finalize-shortx-ui-followup
  cancel-in-progress: true

jobs:
  followup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: agent/finalize-shortx-ui-runtime
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore reviewable API baseline
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          from report_api_usage import baseline_document, scan_repository
          files, entries = scan_repository(root)
          document = baseline_document(files, entries)
          path = root / "constraints" / "API_USAGE_BASELINE.json"
          path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("restored rich API baseline usages=%d files=%d" % (len(entries), len(files)))
          PY

      - name: Prevent signing self-trigger false failure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path(".github/workflows/sign-toolhub.yml")
          text = path.read_text(encoding="utf-8")
          anchor = "      - name: Guard branch\n"
          insertion = (
              "      - name: Detect generated signing commit\n"
              "        id: generated-signing-commit\n"
              "        shell: bash\n"
              "        run: |\n"
              "          subject=\"$(git log -1 --pretty=%s)\"\n"
              "          generated=false\n"
              "          case \"$subject\" in\n"
              "            生成签名产物：*) generated=true ;;\n"
              "          esac\n"
              "          echo \"generated=$generated\" >> \"$GITHUB_OUTPUT\"\n"
              "          echo \"generated signing commit=$generated subject=$subject\"\n"
              "\n"
              "      - name: Guard branch\n"
          )
          if "      - name: Detect generated signing commit\n" not in text:
              if anchor not in text:
                  raise SystemExit("sign workflow guard anchor missing")
              text = text.replace(anchor, insertion, 1)
          old_condition = "        if: steps.current-generated.outputs.current != 'true'\n"
          new_condition = "        if: steps.current-generated.outputs.current != 'true' && steps.generated-signing-commit.outputs.generated != 'true'\n"
          count = text.count(old_condition)
          if count:
              if count != 2:
                  raise SystemExit("unexpected pending/generate condition count=%d" % count)
              text = text.replace(old_condition, new_condition)
          elif text.count(new_condition) != 2:
              raise SystemExit("sign workflow generated commit conditions missing")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify follow-up
        run: |
          python3 scripts/finalize_shortx_ui_runtime.py --check
          python3 scripts/verify_api_usage_policy.py
          python3 scripts/verify_module_boundaries.py
          python3 scripts/verify_documentation_consistency.py
          python3 .github/scripts/es5_scan.py
          python3 scripts/verify_js_syntax.py
          git diff --check

      - name: Commit follow-up
        shell: bash
        run: |
          rm -f .github/workflows/finalize-shortx-ui-followup.yml
          git config user.name "toolhub-automation"
          git config user.email "toolhub-automation@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No follow-up changes"
            exit 0
          fi
          git commit -m "收敛 ShortXUI 封装基线与签名回路"
          git push origin HEAD:agent/finalize-shortx-ui-runtime
