name: beta-entry-channel-filter-fix

on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/beta-entry-channel-filter-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN || github.token }}
          persist-credentials: false

      - name: Apply entry channel filter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          entry = Path('ToolHub.js')
          text = entry.read_text(encoding='utf-8')
          old_version = 'var TOOLHUB_ENTRY_VERSION = 20260727234500;'
          new_version = 'var TOOLHUB_ENTRY_VERSION = 20260728000100;'
          if old_version in text:
              text = text.replace(old_version, new_version, 1)
          elif new_version not in text:
              raise SystemExit('unexpected ToolHub entry version')

          block = '''var modules = ["th_01_base.js", "th_02_core.js", "th_24_shortx_ui_runtime.js", "th_03_icon.js", "th_04_theme.js", "th_05_persistence.js",
                         "th_06_icon_parser.js", "th_08_content.js", "th_09_animation.js",
                         "th_10_shell.js", "th_11_action.js", "th_12_rebuild.js", "th_13_panel_ui.js",
                         "th_14_panels.js", "th_14_button_shortcut.js", "th_14_button_icon_editor.js", "th_14_button_editor.js",
                         "th_14_color_picker.js", "th_14_icon_picker.js", "th_14_schema_editor.js", "th_15_extra.js", "th_34_shortx_ui_lab.js", "th_15_main_panel.js", "th_16_entry.js", "th_17_pointer.js", "th_18_pointer_ocr.js", "th_19_position_state.js", "th_20_pickword.js", "th_21_result_preview.js", "th_22_image_viewer.js", "th_23_screenshot_manager.js"];
          '''
          channel_filter = '''// Beta 入口文件也允许当前活动通道仍为 Stable。此时必须使用 Stable 模块集合，
          // 不能拿 Beta 专用实验模块去对照 main/manifest.json。
          if (TOOLHUB_UPDATE_CHANNEL !== "beta") {
              var __toolHubChannelModules = [];
              for (var __toolHubModuleIndex = 0; __toolHubModuleIndex < modules.length; __toolHubModuleIndex++) {
                  var __toolHubModuleName = String(modules[__toolHubModuleIndex]);
                  if (__toolHubModuleName === "th_24_shortx_ui_runtime.js" || __toolHubModuleName === "th_34_shortx_ui_lab.js") continue;
                  __toolHubChannelModules.push(__toolHubModuleName);
              }
              modules = __toolHubChannelModules;
          }
          '''
          if channel_filter not in text:
              if block not in text:
                  raise SystemExit('ToolHub modules block not found')
              text = text.replace(block, block + channel_filter, 1)
          entry.write_text(text, encoding='utf-8')

          verify = Path('scripts/verify_shortx_ui_windowhost.py')
          verify_text = verify.read_text(encoding='utf-8')
          structure_line = 'STRUCTURE = (ROOT / "docs/STRUCTURE.md").read_text(encoding="utf-8")\n'
          entry_line = 'ENTRY = (ROOT / "ToolHub.js").read_text(encoding="utf-8")\n'
          if entry_line not in verify_text:
              if structure_line not in verify_text:
                  raise SystemExit('WindowHost verifier structure anchor missing')
              verify_text = verify_text.replace(structure_line, structure_line + entry_line, 1)
          workflow_anchor = 'for workflow, label in ((VERIFY, "verify"), (SIGN, "sign")):\n    require(workflow, "python3 scripts/verify_shortx_ui_windowhost.py", label + " workflow")\n\n'
          checks = '''require(ENTRY, 'if (TOOLHUB_UPDATE_CHANNEL !== "beta")', "stable channel module filter")
          require(ENTRY, '__toolHubModuleName === "th_24_shortx_ui_runtime.js"', "runtime channel filter")
          require(ENTRY, '__toolHubModuleName === "th_34_shortx_ui_lab.js"', "lab channel filter")

          '''
          if checks not in verify_text:
              if workflow_anchor not in verify_text:
                  raise SystemExit('WindowHost verifier workflow anchor missing')
              verify_text = verify_text.replace(workflow_anchor, workflow_anchor + checks, 1)
          verify.write_text(verify_text, encoding='utf-8')

          record = Path('updates/records/20260727-beta-entry-channel-module-filter.json')
          data = json.loads(record.read_text(encoding='utf-8'))
          clean = {
              'schema': 1,
              'id': '20260727-beta-entry-channel-module-filter',
              'manifestVersion': 0,
              'type': 'fix',
              'title': '修复 Beta 入口跨通道模块清单自检',
              'details': [
                  'Beta 入口仅在当前活动更新通道为 beta 时加载 ShortXUI Runtime 与实验室模块。',
                  '使用 Beta 入口但本地活动通道仍为 stable 时，入口会自动过滤 Beta 专用模块，并与 main Manifest 保持一致。',
                  'Beta 通道仍完整加载 th_24_shortx_ui_runtime.js 和 th_34_shortx_ui_lab.js；main 与 ClipHub 不做修改。'
              ]
          }
          record.write_text(json.dumps(clean, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          node --check ToolHub.js
          python3 -m py_compile scripts/verify_shortx_ui_windowhost.py
          python3 scripts/verify_shortx_ui_windowhost.py
          python3 .github/scripts/es5_scan.py
          python3 scripts/verify_js_syntax.py
          python3 scripts/verify_update_history.py --require-one-pending

      - name: Commit fix directly to beta
        shell: bash
        env:
          TOOLHUB_AUTOMATION_TOKEN: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}
        run: |
          if [ -z "$TOOLHUB_AUTOMATION_TOKEN" ]; then
            echo "TOOLHUB_AUTOMATION_TOKEN is empty"
            exit 1
          fi
          git rm .github/workflows/beta-entry-channel-filter-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ToolHub.js scripts/verify_shortx_ui_windowhost.py updates/records/20260727-beta-entry-channel-module-filter.json
          git commit -m "Beta：修复入口跨通道模块清单自检"
          git remote set-url origin "https://x-access-token:${TOOLHUB_AUTOMATION_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:beta
