name: beta-mask-toolapp-zorder-runner

on:
  push:
    branches: [beta]
    paths:
      - scripts/.beta-mask-toolapp-zorder-trigger

permissions:
  contents: write

concurrency:
  group: beta-mask-toolapp-zorder-runner
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN || github.token }}
          persist-credentials: false

      - name: Fetch stable baseline
        run: git fetch --no-tags origin main

      - name: Apply reviewed fix
        shell: bash
        run: |
          python3 scripts/apply_beta_mask_toolapp_zorder_fix.py
          python3 scripts/report_dead_module_symbols.py --write docs/audits/DEAD_CODE_AUDIT.md
          python3 scripts/report_protected_wrapper_chains.py --write docs/audits/PROTECTED_WRAPPER_AUDIT.md
          python3 scripts/report_module_symbol_audits.py --write docs/audits/MODULE_SYMBOL_AUDIT.md
          python3 scripts/report_entry_symbols.py --write docs/audits/ENTRY_SYMBOL_AUDIT.md

      - name: Verify reviewed fix
        shell: bash
        run: |
          python3 .github/scripts/es5_scan.py
          python3 scripts/verify_js_syntax.py
          python3 scripts/verify_module_boundaries.py
          python3 scripts/verify_api_usage_policy.py
          python3 scripts/verify_coloros_rhino_color_safety.py
          python3 scripts/verify_rhino_color_api_safety.py
          python3 scripts/verify_main_panel_close_lifecycle.py
          python3 scripts/verify_shortx_ui_windowhost.py
          python3 scripts/verify_beta_channel_manifest_sync.py
          python3 scripts/report_dead_module_symbols.py --check docs/audits/DEAD_CODE_AUDIT.md
          python3 scripts/report_protected_wrapper_chains.py --check docs/audits/PROTECTED_WRAPPER_AUDIT.md
          python3 scripts/report_module_symbol_audits.py --check docs/audits/MODULE_SYMBOL_AUDIT.md
          python3 scripts/report_entry_symbols.py --check docs/audits/ENTRY_SYMBOL_AUDIT.md
          git diff --check

      - name: Commit directly to beta
        shell: bash
        env:
          TOOLHUB_AUTOMATION_TOKEN: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}
        run: |
          if [ -z "$TOOLHUB_AUTOMATION_TOKEN" ]; then
            echo "TOOLHUB_AUTOMATION_TOKEN is empty"
            exit 1
          fi
          rm -f \
            .github/workflows/beta-mask-toolapp-zorder-runner.yml \
            .github/workflows/beta-mask-toolapp-zorder-fix.yml \
            scripts/apply_beta_mask_toolapp_zorder_fix.py \
            scripts/.beta-mask-toolapp-zorder-trigger
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修复 Beta ToolApp 全屏遮罩阻塞"
          git remote set-url origin "https://x-access-token:${TOOLHUB_AUTOMATION_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:beta
