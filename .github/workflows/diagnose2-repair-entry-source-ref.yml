name: diagnose2-repair-entry-source-ref

on:
  pull_request:
    branches: [beta]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: diagnose2-repair-entry-source-ref
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'agent/beta-fix-wm-remove-view-crash-20260726'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta-fix-wm-remove-view-crash-20260726
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply complete entry patch in workspace
        shell: bash
        run: |
          python3 - <<'PYEXTRACT'
          from pathlib import Path
          source = Path('.github/workflows/apply-repair-entry-source-ref.yml').read_text(encoding='utf-8')
          begin_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n"
          begin = source.index(begin_marker)
          end = source.index(end_marker, begin) + len(end_marker)
          lines = []
          for line in source[begin:end].splitlines():
              if line == '': lines.append('')
              elif line.startswith('          '): lines.append(line[10:])
              else: raise SystemExit('unexpected indentation: ' + line)
          Path('/tmp/apply-entry-source.sh').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PYEXTRACT
          bash /tmp/apply-entry-source.sh
          python3 - <<'PY'
          from pathlib import Path
          replacements = (
              ('TOOLHUB_ENTRY_UPDATE_SOURCE_REF', 'TOOLHUB_ENTRY_FETCH_REF'),
              ('TOOLHUB_UPDATE_SOURCE_REF', 'TOOLHUB_FETCH_REF'),
          )
          for rel in ('ToolHub.js', 'scripts/verify_github_only_source.py'):
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Install signing key
        shell: bash
        env:
          TOOLHUB_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.TOOLHUB_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          test -n "$TOOLHUB_SIGNING_PRIVATE_KEY_PEM"
          mkdir -p "$HOME/.hermes/toolhub_signing"
          printf '%s\n' "$TOOLHUB_SIGNING_PRIVATE_KEY_PEM" > "$HOME/.hermes/toolhub_signing/private_key.pem"
          chmod 600 "$HOME/.hermes/toolhub_signing/private_key.pem"
      - name: Generate signed workspace
        run: |
          git fetch --no-tags origin beta
          python3 scripts/generate_signed_manifest.py --yes --channel beta --base-ref origin/beta
      - name: ES5 scan
        run: python3 .github/scripts/es5_scan.py
      - name: JavaScript syntax
        run: python3 scripts/verify_js_syntax.py
      - name: Code constraints
        run: python3 scripts/verify_code_constraints.py --output code-constraint-report.json
      - name: GitHub source constraints
        run: python3 scripts/verify_github_only_source.py
      - name: Update security mode
        run: python3 scripts/verify_update_security_mode.py
      - name: Changed module versions
        run: python3 scripts/verify_changed_module_versions.py --base-ref origin/beta
      - name: Main panel close lifecycle
        run: python3 scripts/verify_main_panel_close_lifecycle.py
      - name: Update history
        run: python3 scripts/verify_update_history.py
      - name: Manifest
        run: python3 scripts/verify_manifest.py
      - name: Update version page
        run: python3 scripts/verify_update_version_page.py
      - name: Manifest signature
        run: python3 .github/scripts/verify_manifest_signature.py
      - name: Whitespace
        run: git diff --check
