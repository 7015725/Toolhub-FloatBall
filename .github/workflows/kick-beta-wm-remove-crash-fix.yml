name: kick-beta-wm-remove-crash-fix

on:
  pull_request:
    branches:
      - beta
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  kick:
    if: github.head_ref == 'agent/beta-fix-wm-remove-view-crash-20260726'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta-fix-wm-remove-view-crash-20260726
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}

      - name: Delete kick workflow and trigger branch push workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/kick-beta-wm-remove-crash-fix.yml
          git commit -m "启动 Beta WindowManager 崩溃修复"
          git push origin HEAD:agent/beta-fix-wm-remove-view-crash-20260726
