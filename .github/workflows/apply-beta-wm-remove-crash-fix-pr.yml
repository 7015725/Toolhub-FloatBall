name: apply-beta-wm-remove-crash-fix-pr

on:
  pull_request:
    branches:
      - beta
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-beta-wm-remove-crash-fix-pr
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/beta-fix-wm-remove-view-crash-20260726'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta-fix-wm-remove-view-crash-20260726
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}

      - name: Extract and run reviewed repair script
        shell: bash
        run: |
          python3 - <<'PYEXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/apply-beta-wm-remove-crash-fix.yml').read_text(encoding='utf-8')
          begin_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n"
          begin = source.index(begin_marker)
          end = source.index(end_marker, begin) + len(end_marker)
          block = source[begin:end]
          lines = []
          for line in block.splitlines():
              if not line.startswith('          '):
                  raise SystemExit('unexpected repair-script indentation: ' + line)
              lines.append(line[10:])
          Path('/tmp/apply-beta-wm-remove-crash-fix.sh').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PYEXTRACT
          bash /tmp/apply-beta-wm-remove-crash-fix.sh

      - name: Refresh deterministic audits
        shell: bash
        run: |
          python3 scripts/report_dead_module_symbols.py --write docs/audits/DEAD_CODE_AUDIT.md
          python3 scripts/report_protected_wrapper_chains.py --write docs/audits/PROTECTED_WRAPPER_AUDIT.md
          python3 scripts/report_module_symbol_audits.py --write docs/audits/MODULE_SYMBOL_AUDIT.md

      - name: Run targeted verification
        shell: bash
        run: |
          python3 .github/scripts/es5_scan.py
          python3 scripts/verify_js_syntax.py
          python3 scripts/verify_main_panel_close_lifecycle.py
          python3 scripts/verify_toolapp_main_thread_affinity.py
          python3 scripts/verify_update_history.py --require-one-pending
          git diff --check

      - name: Commit repair and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-beta-wm-remove-crash-fix.yml
          git rm .github/workflows/apply-beta-wm-remove-crash-fix-pr.yml
          git add code/th_09_animation.js code/th_16_entry.js \
            scripts/verify_main_panel_close_lifecycle.py \
            docs/audits/DEAD_CODE_AUDIT.md \
            docs/audits/PROTECTED_WRAPPER_AUDIT.md \
            docs/audits/MODULE_SYMBOL_AUDIT.md \
            updates/records/20260726-beta-system-server-window-remove-crash.json
          git commit -m "修复 WindowManager 同步移除导致的系统重启"
          git push origin HEAD:agent/beta-fix-wm-remove-view-crash-20260726
