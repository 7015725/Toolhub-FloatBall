name: fix-pickword-verifiers-20260820

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/fix-pickword-verifiers-20260820.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN || github.token }}
          persist-credentials: false

      - name: Update verifier compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  print('already:', label)
                  return
              if old not in text:
                  raise SystemExit('missing anchor: ' + label)
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('patched:', label)

          patch(
              'scripts/verify_channel_private_storage_isolation.py',
              'require(PICKWORD.splitlines()[0] == "// @version 1.0.21", "th_20_pickword.js version must be 1.0.21")',
              'require(PICKWORD.splitlines()[0] in ("// @version 1.0.21", "// @version 1.0.22"), "th_20_pickword.js version must be 1.0.21 or 1.0.22")',
              'channel private storage th20 version')

          patch(
              'scripts/verify_pickword_image_viewer.py',
              'require(\'uiDp(108, 132)\' in th20 and \'uiDp(156, 220)\' in th20, "compact thumbnail/text dimensions missing")',
              'compact_layout = \'uiDp(108, 132)\' in th20 and \'uiDp(156, 220)\' in th20\nreference_layout = \'uiDp(150, 188)\' in th20 and \'uiDp(164, 220)\' in th20\nrequire(compact_layout or reference_layout, "supported thumbnail/text dimensions missing")',
              'image viewer layout dimensions')

          p = Path('scripts/fix_pickword_reference_layout_api_usage.py')
          text = p.read_text(encoding='utf-8')
          old = '''    old = "require('uiDp(108, 132)' in th20 and 'uiDp(156, 220)' in th20, \\\"compact thumbnail/text dimensions missing\\\")"\n    new = "require('uiDp(150, 188)' in th20 and 'uiDp(164, 220)' in th20, \\\"reference screenshot/text dimensions missing\\\")"\n    if old in text:\n        text = text.replace(old, new, 1)\n    require(new in text, \\\"image viewer verifier reference dimensions\\\")\n    IMAGE_VIEWER_VERIFY.write_text(text, encoding=\\\"utf-8\\\")'''
          # Match the source without escaped display backslashes.
          old = '''    old = "require('uiDp(108, 132)' in th20 and 'uiDp(156, 220)' in th20, \\"compact thumbnail/text dimensions missing\\")"\n    new = "require('uiDp(150, 188)' in th20 and 'uiDp(164, 220)' in th20, \\"reference screenshot/text dimensions missing\\")"\n    if old in text:\n        text = text.replace(old, new, 1)\n    require(new in text, \\"image viewer verifier reference dimensions\\")\n    IMAGE_VIEWER_VERIFY.write_text(text, encoding=\"utf-8\")'''
          if old not in text:
              old = '''    old = "require('uiDp(108, 132)' in th20 and 'uiDp(156, 220)' in th20, \\\"compact thumbnail/text dimensions missing\\\")"'''
          flexible_marker = "reference_layout = 'uiDp(150, 188)' in th20 and 'uiDp(164, 220)' in th20"
          if flexible_marker not in text:
              start = text.find('    old = "require(\'uiDp(108, 132)')
              end = text.find('    IMAGE_VIEWER_VERIFY.write_text(text, encoding="utf-8")', start)
              if start < 0 or end < 0:
                  raise SystemExit('missing anchor: fixup verifier block')
              end += len('    IMAGE_VIEWER_VERIFY.write_text(text, encoding="utf-8")')
              block = '''    old = "require('uiDp(108, 132)' in th20 and 'uiDp(156, 220)' in th20, \\\"compact thumbnail/text dimensions missing\\\")"\n    reference_only = "require('uiDp(150, 188)' in th20 and 'uiDp(164, 220)' in th20, \\\"reference screenshot/text dimensions missing\\\")"\n    flexible = "compact_layout = 'uiDp(108, 132)' in th20 and 'uiDp(156, 220)' in th20\\nreference_layout = 'uiDp(150, 188)' in th20 and 'uiDp(164, 220)' in th20\\nrequire(compact_layout or reference_layout, \\\"supported thumbnail/text dimensions missing\\\")"\n    if old in text:\n        text = text.replace(old, flexible, 1)\n    elif reference_only in text:\n        text = text.replace(reference_only, flexible, 1)\n    require(\"reference_layout = 'uiDp(150, 188)' in th20 and 'uiDp(164, 220)' in th20\" in text, \\\"image viewer verifier reference dimensions\\\")\n    IMAGE_VIEWER_VERIFY.write_text(text, encoding=\"utf-8\")'''
              text = text[:start] + block + text[end:]
              p.write_text(text, encoding='utf-8')
              print('patched: fixup verifier compatibility')
          else:
              print('already: fixup verifier compatibility')
          PY

          git diff --check
          python3 scripts/verify_pickword_long_click_api34.py
          python3 scripts/verify_pickword_emoji_grapheme.py
          python3 scripts/verify_pickword_unified_cleanup.py
          python3 scripts/verify_channel_private_storage_isolation.py
          python3 scripts/verify_pickword_image_viewer.py

      - name: Commit fixes
        shell: bash
        env:
          TOOLHUB_AUTOMATION_TOKEN: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify_channel_private_storage_isolation.py scripts/verify_pickword_image_viewer.py scripts/fix_pickword_reference_layout_api_usage.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: support pickword reference layout verifiers'
          git remote set-url origin "https://x-access-token:${TOOLHUB_AUTOMATION_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:beta
