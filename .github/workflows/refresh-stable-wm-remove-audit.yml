name: refresh-stable-wm-remove-audit

on:
  push:
    branches:
      - agent/main-fix-wm-remove-view-crash-20260727

permissions:
  contents: write

concurrency:
  group: refresh-stable-wm-remove-audit
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stable release branch
        uses: actions/checkout@v4
        with:
          ref: agent/main-fix-wm-remove-view-crash-20260727
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Refresh deterministic module audit
        run: |
          python3 scripts/report_module_symbol_audits.py --write docs/audits/MODULE_SYMBOL_AUDIT.md
          python3 scripts/report_module_symbol_audits.py --check docs/audits/MODULE_SYMBOL_AUDIT.md

      - name: Verify WindowManager fix boundary
        run: |
          python3 .github/scripts/es5_scan.py
          python3 scripts/verify_js_syntax.py
          python3 scripts/verify_main_panel_close_lifecycle.py
          git diff --check

      - name: Commit audit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-stable-wm-remove-audit.yml
          git add docs/audits/MODULE_SYMBOL_AUDIT.md
          git commit -m "刷新 Stable WindowManager 修复审计"
          git push origin HEAD:agent/main-fix-wm-remove-view-crash-20260727
