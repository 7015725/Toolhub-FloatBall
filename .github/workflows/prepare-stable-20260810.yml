name: prepare-stable-20260810

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prepare-stable-20260810-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'release/main-20260810-sync-final'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN || github.token }}
          persist-credentials: false

      - name: Fetch channel references
        shell: bash
        run: |
          git fetch --no-tags origin main beta
          git show origin/beta:constraints/api.json > /tmp/beta-api.json

      - name: Prepare Stable 2026-08-10 promotion
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          entry_path = Path('ToolHub.js')
          text = entry_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'var TOOLHUB_STABLE_MODULES = (\[[\s\S]*?\]);\n'
              r'var modules = (\[[\s\S]*?\]);\n\n'
              r'function copyToolHubModuleList'
          )
          match = pattern.search(text)
          if match:
              stable_literal = match.group(1)
              beta_literal = match.group(2)
              replacement = (
                  'var modules = ' + stable_literal + ';\n'
                  'var TOOLHUB_STABLE_MODULES = copyToolHubModuleList(modules);\n'
                  'var TOOLHUB_BETA_MODULES = ' + beta_literal + ';\n\n'
                  'function copyToolHubModuleList'
              )
              text = text[:match.start()] + replacement + text[match.end():]
              text = text.replace(
                  '\nvar TOOLHUB_BETA_MODULES = copyToolHubModuleList(modules);\n',
                  '\n',
                  1,
              )
              entry_path.write_text(text, encoding='utf-8')
          elif 'var TOOLHUB_STABLE_MODULES = copyToolHubModuleList(modules);' not in text:
              raise SystemExit('Stable/Beta module declaration anchor not found')

          record_path = Path('updates/records/20260810-stable-sync-beta-updates.json')
          record = json.loads(record_path.read_text(encoding='utf-8'))
          for key in ('date', 'modules', 'entry', 'manifestVersion'):
              record.pop(key, None)
          record_path.write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          api_path = Path('constraints/api.json')
          api = json.loads(api_path.read_text(encoding='utf-8'))
          beta_api = json.loads(Path('/tmp/beta-api.json').read_text(encoding='utf-8'))
          wanted = {
              'api-panel-ime-avoidance',
              'api-panel-ime-avoidance-existing-scope',
              'api-panel-ime-restore-back-handoff',
          }
          existing = {str(rule.get('id')) for rule in api.get('rules', [])}
          beta_rules = {str(rule.get('id')): rule for rule in beta_api.get('rules', [])}
          for rule_id in sorted(wanted):
              if rule_id not in beta_rules:
                  raise SystemExit('Missing Beta API rule: ' + rule_id)
              if rule_id not in existing:
                  api.setdefault('rules', []).append(beta_rules[rule_id])
                  existing.add(rule_id)

          rules_by_id = {str(rule.get('id')): rule for rule in api.get('rules', [])}
          existing_scope_rule = rules_by_id.get('api-panel-ime-avoidance-existing-scope')
          if not existing_scope_rule:
              raise SystemExit('IME existing-scope API rule missing')
          for usage_key in [
              'android|class|android.os.Handler',
              'android|class|android.util.DisplayMetrics',
              'android|method|android.os.Looper#getMainLooper',
              'java|class|java.lang.Runnable',
              'java|method|java.lang#Runnable',
          ]:
              if usage_key not in existing_scope_rule.setdefault('usageKeys', []):
                  existing_scope_rule['usageKeys'].append(usage_key)
          for scope_path in [
              'code/th_09_animation.js',
              'code/th_14_button_icon_editor.js',
          ]:
              if scope_path not in existing_scope_rule.setdefault('scope', []):
                  existing_scope_rule['scope'].append(scope_path)
          existing_scope_rule['reason'] = (
              '精确批准 2026-08-10 IME 避让复用既有显示、主线程 Handler/Looper 与 Runnable 回调 API，'
              '并覆盖这些 API 在 Stable 当前代码中的既有使用文件，避免未审核范围漂移'
          )
          api_path.write_text(json.dumps(api, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python3 scripts/report_api_usage.py --write constraints/API_USAGE_BASELINE.json
          python3 scripts/verify_module_boundaries.py
          python3 scripts/report_api_usage.py --check constraints/API_USAGE_BASELINE.json
          python3 scripts/verify_changed_module_versions.py --base-ref origin/main
          git diff --check

      - name: Commit prepared Stable files
        shell: bash
        env:
          TOOLHUB_AUTOMATION_TOKEN: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ToolHub.js constraints/api.json constraints/API_USAGE_BASELINE.json updates/records/20260810-stable-sync-beta-updates.json
          if git diff --cached --quiet; then
            echo "Stable promotion files already prepared"
            exit 0
          fi
          git commit -m "收口 2026-08-10 Stable 发布边界"
          if [ -n "$TOOLHUB_AUTOMATION_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${TOOLHUB_AUTOMATION_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
