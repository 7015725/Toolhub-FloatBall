name: fix-beta-wm-api-baseline

on:
  pull_request:
    branches:
      - beta
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: fix-beta-wm-api-baseline
  cancel-in-progress: true

jobs:
  fix:
    if: github.head_ref == 'agent/beta-fix-wm-remove-view-crash-20260726'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta-fix-wm-remove-view-crash-20260726
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}

      - name: Replace direct Runnable run call
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('code/th_09_animation.js')
          text = path.read_text(encoding='utf-8')
          start_marker = '      var maskCleanup = new java.lang.Runnable({ run: function() {\n'
          end_marker = '      }});\n      var maskCleanupPosted = false;'
          start = text.find(start_marker)
          end = text.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit('mask cleanup markers missing')
          body = text[start + len(start_marker):end]
          replacement = (
              '      function performMaskCleanup() {\n' +
              body +
              '      }\n'
              '      var maskCleanup = new java.lang.Runnable({ run: function() {\n'
              '        performMaskCleanup();\n'
              '      }});\n'
              '      var maskCleanupPosted = false;'
          )
          text = text[:start] + replacement + text[end + len(end_marker):]
          old_fallback = '      if (!maskCleanupPosted) maskCleanup.run();'
          new_fallback = '      if (!maskCleanupPosted) performMaskCleanup();'
          if text.count(old_fallback) != 1:
              raise SystemExit('mask cleanup fallback count=' + str(text.count(old_fallback)))
          text = text.replace(old_fallback, new_fallback, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify API and lifecycle constraints
        shell: bash
        run: |
          python3 .github/scripts/es5_scan.py
          python3 scripts/verify_js_syntax.py
          python3 scripts/verify_code_constraints.py --output code-constraint-report.json
          python3 scripts/verify_main_panel_close_lifecycle.py
          git diff --check

      - name: Commit correction and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-beta-wm-api-baseline.yml
          git add code/th_09_animation.js
          git commit -m "修复 WindowManager 延迟清理 API 基线"
          git push origin HEAD:agent/beta-fix-wm-remove-view-crash-20260726
