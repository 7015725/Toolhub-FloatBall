name: apply-repair-entry-source-ref

on:
  pull_request:
    branches: [beta]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: apply-repair-entry-source-ref
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/beta-fix-wm-remove-view-crash-20260726'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta-fix-wm-remove-view-crash-20260726
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Patch entry source ref and verifiers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path.cwd()
          ENTRY = ROOT / 'ToolHub.js'
          OLD_ENTRY_VERSION = '20260721201500'
          NEW_ENTRY_VERSION = '20260727010000'
          SOURCE_REF = 'agent/beta-fix-wm-remove-view-crash-20260726'

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit('%s replacement count=%d' % (label, count))
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              ENTRY,
              'var TOOLHUB_ENTRY_VERSION = %s; // 入口文件版本，仅在 ToolHub.js 变化时提升\n\nvar TOOLHUB_CHANNEL_SPECS = {' % OLD_ENTRY_VERSION,
              'var TOOLHUB_ENTRY_VERSION = %s; // 入口文件版本，仅在 ToolHub.js 变化时提升\n'
              'var TOOLHUB_ENTRY_FORCED_UPDATE_CHANNEL = "beta"; // 修复分支测试入口：保持 Beta 发布清单与私有目录\n'
              'var TOOLHUB_ENTRY_UPDATE_SOURCE_REF = "%s"; // 修复分支测试入口：实际 GitHub 下载 ref\n\n'
              'var TOOLHUB_CHANNEL_SPECS = {' % (NEW_ENTRY_VERSION, SOURCE_REF),
              'entry constants',
          )

          replace_once(
              ENTRY,
              'function getToolHubChannelSpec(channel) {\n'
              '    return TOOLHUB_CHANNEL_SPECS[normalizeToolHubUpdateChannel(channel)] || TOOLHUB_CHANNEL_SPECS.stable;\n'
              '}\n',
              'function getToolHubChannelSpec(channel) {\n'
              '    return TOOLHUB_CHANNEL_SPECS[normalizeToolHubUpdateChannel(channel)] || TOOLHUB_CHANNEL_SPECS.stable;\n'
              '}\n\n'
              'function getToolHubEntryUpdateChannel(value) {\n'
              '    var forced = "";\n'
              '    try { forced = String(TOOLHUB_ENTRY_FORCED_UPDATE_CHANNEL || "").replace(/^\\s+|\\s+$/g, "").toLowerCase(); } catch (eForcedChannel) { forced = ""; }\n'
              '    if (forced && TOOLHUB_CHANNEL_SPECS.hasOwnProperty(forced)) return forced;\n'
              '    return normalizeToolHubUpdateChannel(value);\n'
              '}\n\n'
              'function getToolHubEntryUpdateSourceRef(branch) {\n'
              '    var ref = "";\n'
              '    try { ref = String(TOOLHUB_ENTRY_UPDATE_SOURCE_REF || "").replace(/^\\s+|\\s+$/g, ""); } catch (eSourceRef) { ref = ""; }\n'
              '    if (!ref) return String(branch || "");\n'
              '    if (!/^[A-Za-z0-9._\\/-]+$/.test(ref) || ref.indexOf("..") >= 0 || ref.charAt(0) === "/" || ref.charAt(ref.length - 1) === "/") {\n'
              '        throw "invalid ToolHub update source ref: " + ref;\n'
              '    }\n'
              '    return ref;\n'
              '}\n\n'
              'function isToolHubEntryUpdateSourceLocked() {\n'
              '    try { return String(TOOLHUB_ENTRY_UPDATE_SOURCE_REF || "").replace(/^\\s+|\\s+$/g, "").length > 0; } catch (eLocked) {}\n'
              '    return false;\n'
              '}\n',
              'entry source helpers',
          )

          replace_once(
              ENTRY,
              'var TOOLHUB_UPDATE_CHANNEL = normalizeToolHubUpdateChannel(TOOLHUB_CHANNEL_STATE.activeChannel);\n'
              'var TOOLHUB_CHANNEL_SPEC = getToolHubChannelSpec(TOOLHUB_UPDATE_CHANNEL);\n'
              'var TOOLHUB_UPDATE_BRANCH = String(TOOLHUB_CHANNEL_SPEC.branch);\n'
              'var TOOLHUB_CHANNEL_LABEL = String(TOOLHUB_CHANNEL_SPEC.label);\n'
              'var GIT_ROOT = "https://raw.githubusercontent.com/7015725/Toolhub-FloatBall/" + TOOLHUB_UPDATE_BRANCH + "/";',
              'var TOOLHUB_UPDATE_CHANNEL = getToolHubEntryUpdateChannel(TOOLHUB_CHANNEL_STATE.activeChannel);\n'
              'var TOOLHUB_CHANNEL_SPEC = getToolHubChannelSpec(TOOLHUB_UPDATE_CHANNEL);\n'
              'var TOOLHUB_UPDATE_BRANCH = String(TOOLHUB_CHANNEL_SPEC.branch);\n'
              'var TOOLHUB_UPDATE_SOURCE_REF = getToolHubEntryUpdateSourceRef(TOOLHUB_UPDATE_BRANCH);\n'
              'var TOOLHUB_CHANNEL_LABEL = String(TOOLHUB_CHANNEL_SPEC.label);\n'
              'var GIT_ROOT = "https://raw.githubusercontent.com/7015725/Toolhub-FloatBall/" + TOOLHUB_UPDATE_SOURCE_REF + "/";',
              'initial source ref',
          )

          replace_once(
              ENTRY,
              '    branch: TOOLHUB_UPDATE_BRANCH,\n'
              '    rootDir: "",',
              '    branch: TOOLHUB_UPDATE_BRANCH,\n'
              '    sourceRef: TOOLHUB_UPDATE_SOURCE_REF,\n'
              '    sourceLocked: isToolHubEntryUpdateSourceLocked(),\n'
              '    rootDir: "",',
              'update state source fields',
          )

          replace_once(
              ENTRY,
              'function applyToolHubChannelRuntime(channel) {\n'
              '    var normalized = normalizeToolHubUpdateChannel(channel);\n'
              '    var spec = getToolHubChannelSpec(normalized);\n'
              '    TOOLHUB_UPDATE_CHANNEL = normalized;\n'
              '    TOOLHUB_CHANNEL_SPEC = spec;\n'
              '    TOOLHUB_UPDATE_BRANCH = String(spec.branch);\n'
              '    TOOLHUB_CHANNEL_LABEL = String(spec.label);\n'
              '    GIT_ROOT = "https://raw.githubusercontent.com/7015725/Toolhub-FloatBall/" + TOOLHUB_UPDATE_BRANCH + "/";\n'
              '    GIT_BASE = GIT_ROOT + "code/";',
              'function applyToolHubChannelRuntime(channel) {\n'
              '    var normalized = getToolHubEntryUpdateChannel(channel);\n'
              '    var spec = getToolHubChannelSpec(normalized);\n'
              '    TOOLHUB_UPDATE_CHANNEL = normalized;\n'
              '    TOOLHUB_CHANNEL_SPEC = spec;\n'
              '    TOOLHUB_UPDATE_BRANCH = String(spec.branch);\n'
              '    TOOLHUB_UPDATE_SOURCE_REF = getToolHubEntryUpdateSourceRef(TOOLHUB_UPDATE_BRANCH);\n'
              '    TOOLHUB_CHANNEL_LABEL = String(spec.label);\n'
              '    GIT_ROOT = "https://raw.githubusercontent.com/7015725/Toolhub-FloatBall/" + TOOLHUB_UPDATE_SOURCE_REF + "/";\n'
              '    GIT_BASE = GIT_ROOT + "code/";',
              'runtime source ref',
          )

          replace_once(
              ENTRY,
              '            TOOLHUB_UPDATE_STATE.branch = TOOLHUB_UPDATE_BRANCH;\n'
              '            TOOLHUB_UPDATE_STATE.rootDir = TOOLHUB_BOOT_ROOT_DIR;\n'
              '            TOOLHUB_UPDATE_STATE.source = "GitHub/" + TOOLHUB_UPDATE_BRANCH;',
              '            TOOLHUB_UPDATE_STATE.branch = TOOLHUB_UPDATE_BRANCH;\n'
              '            TOOLHUB_UPDATE_STATE.sourceRef = TOOLHUB_UPDATE_SOURCE_REF;\n'
              '            TOOLHUB_UPDATE_STATE.sourceLocked = isToolHubEntryUpdateSourceLocked();\n'
              '            TOOLHUB_UPDATE_STATE.rootDir = TOOLHUB_BOOT_ROOT_DIR;\n'
              '            TOOLHUB_UPDATE_STATE.source = "GitHub/" + TOOLHUB_UPDATE_SOURCE_REF;',
              'runtime update state source',
          )

          replace_once(
              ENTRY,
              '        TOOLHUB_UPDATE_STATE.source = "GitHub/" + TOOLHUB_UPDATE_BRANCH;\n'
              '        TOOLHUB_UPDATE_STATE.channel = TOOLHUB_UPDATE_CHANNEL;\n'
              '        TOOLHUB_UPDATE_STATE.channelLabel = TOOLHUB_CHANNEL_LABEL;\n'
              '        TOOLHUB_UPDATE_STATE.branch = TOOLHUB_UPDATE_BRANCH;\n'
              '        TOOLHUB_UPDATE_STATE.rootDir = getToolHubRootDir();',
              '        TOOLHUB_UPDATE_STATE.source = "GitHub/" + TOOLHUB_UPDATE_SOURCE_REF;\n'
              '        TOOLHUB_UPDATE_STATE.channel = TOOLHUB_UPDATE_CHANNEL;\n'
              '        TOOLHUB_UPDATE_STATE.channelLabel = TOOLHUB_CHANNEL_LABEL;\n'
              '        TOOLHUB_UPDATE_STATE.branch = TOOLHUB_UPDATE_BRANCH;\n'
              '        TOOLHUB_UPDATE_STATE.sourceRef = TOOLHUB_UPDATE_SOURCE_REF;\n'
              '        TOOLHUB_UPDATE_STATE.sourceLocked = isToolHubEntryUpdateSourceLocked();\n'
              '        TOOLHUB_UPDATE_STATE.rootDir = getToolHubRootDir();',
              'available update source state',
          )

          replace_once(
              ENTRY,
              'function switchToolHubUpdateChannel(targetChannel) {\n'
              '  var target = normalizeToolHubUpdateChannel(targetChannel);',
              'function switchToolHubUpdateChannel(targetChannel) {\n'
              '  if (isToolHubEntryUpdateSourceLocked()) {\n'
              '    return { ok: false, locked: true, msg: "当前测试入口已锁定更新源：" + TOOLHUB_UPDATE_SOURCE_REF };\n'
              '  }\n'
              '  var target = normalizeToolHubUpdateChannel(targetChannel);',
              'channel switch lock',
          )

          replace_once(
              ENTRY,
              '    更新通道: TOOLHUB_CHANNEL_LABEL + " / " + TOOLHUB_UPDATE_BRANCH,\n'
              '    布局: layoutText,',
              '    更新通道: TOOLHUB_CHANNEL_LABEL + " / " + TOOLHUB_UPDATE_BRANCH,\n'
              '    更新源: "GitHub/" + TOOLHUB_UPDATE_SOURCE_REF,\n'
              '    更新源锁定: isToolHubEntryUpdateSourceLocked(),\n'
              '    布局: layoutText,',
              'startup source output',
          )

          entry_text = ENTRY.read_text(encoding='utf-8')
          required = [
              'var TOOLHUB_ENTRY_FORCED_UPDATE_CHANNEL = "beta";',
              'var TOOLHUB_ENTRY_UPDATE_SOURCE_REF = "%s";' % SOURCE_REF,
              'var TOOLHUB_UPDATE_SOURCE_REF = getToolHubEntryUpdateSourceRef(TOOLHUB_UPDATE_BRANCH);',
              'manifest branch mismatch: expected=" + TOOLHUB_UPDATE_BRANCH',
              'GIT_ROOT = "https://raw.githubusercontent.com/7015725/Toolhub-FloatBall/" + TOOLHUB_UPDATE_SOURCE_REF + "/";',
              '当前测试入口已锁定更新源：',
          ]
          for marker in required:
              if marker not in entry_text:
                  raise SystemExit('entry marker missing: ' + marker)

          # 入口版本校验脚本同步提升；历史 JSON 记录中的旧版本保持不变。
          for path in sorted((ROOT / 'scripts').glob('*.py')):
              text = path.read_text(encoding='utf-8')
              if OLD_ENTRY_VERSION in text:
                  path.write_text(text.replace(OLD_ENTRY_VERSION, NEW_ENTRY_VERSION), encoding='utf-8')

          source_verifier = ROOT / 'scripts' / 'verify_github_only_source.py'
          verifier_text = source_verifier.read_text(encoding='utf-8')
          old_check = '''require(
              ENTRY,
              'var GIT_ROOT = "https://raw.githubusercontent.com/7015725/Toolhub-FloatBall/" + TOOLHUB_UPDATE_BRANCH + "/";',
              "fixed GitHub repository with channel branch",
          )'''
          new_check = '''require(
              ENTRY,
              'var TOOLHUB_ENTRY_FORCED_UPDATE_CHANNEL = "beta";',
              "repair entry forced Beta channel",
          )
          require(
              ENTRY,
              'var TOOLHUB_ENTRY_UPDATE_SOURCE_REF = "agent/beta-fix-wm-remove-view-crash-20260726";',
              "repair entry source ref",
          )
          require(
              ENTRY,
              'var GIT_ROOT = "https://raw.githubusercontent.com/7015725/Toolhub-FloatBall/" + TOOLHUB_UPDATE_SOURCE_REF + "/";',
              "fixed GitHub repository with validated source ref",
          )
          require(ENTRY, 'if (!/^[A-Za-z0-9._\\/-]+$/.test(ref)', "source ref allowlist")
          require(ENTRY, 'manifest branch mismatch: expected=" + TOOLHUB_UPDATE_BRANCH', "signed logical branch validation")
          require(ENTRY, '当前测试入口已锁定更新源：', "channel switch lock")'''
          if verifier_text.count(old_check) != 1:
              raise SystemExit('github-only verifier replacement count=%d' % verifier_text.count(old_check))
          source_verifier.write_text(verifier_text.replace(old_check, new_check, 1), encoding='utf-8')

          record_path = ROOT / 'updates' / 'records' / '20260726-beta-system-server-window-remove-crash.json'
          record = json.loads(record_path.read_text(encoding='utf-8'))
          record['manifestVersion'] = 0
          record.pop('date', None)
          record.pop('modules', None)
          record.pop('entry', None)
          detail = '测试入口固定使用 Beta 发布清单与 ToolHub-Beta 私有目录，但实际 GitHub 下载 ref 指向 agent/beta-fix-wm-remove-view-crash-20260726；入口内禁用通道切换，避免测试状态污染 Stable。'
          details = [str(item) for item in (record.get('details') or [])]
          if detail not in details:
              details.append(detail)
          record['details'] = details
          record_path.write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Install signing key
        shell: bash
        env:
          TOOLHUB_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.TOOLHUB_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          test -n "$TOOLHUB_SIGNING_PRIVATE_KEY_PEM"
          mkdir -p "$HOME/.hermes/toolhub_signing"
          printf '%s\n' "$TOOLHUB_SIGNING_PRIVATE_KEY_PEM" > "$HOME/.hermes/toolhub_signing/private_key.pem"
          chmod 600 "$HOME/.hermes/toolhub_signing/private_key.pem"

      - name: Generate Beta-relative signed artifacts
        shell: bash
        run: |
          git fetch --no-tags origin beta
          python3 scripts/generate_signed_manifest.py --yes --channel beta --base-ref origin/beta

      - name: Run targeted verification
        shell: bash
        run: |
          set -eo pipefail
          python3 .github/scripts/es5_scan.py
          python3 scripts/verify_js_syntax.py
          python3 scripts/verify_code_constraints.py --output code-constraint-report.json
          python3 scripts/verify_github_only_source.py
          python3 scripts/verify_update_security_mode.py
          python3 scripts/verify_changed_module_versions.py --base-ref origin/beta
          python3 scripts/verify_main_panel_close_lifecycle.py
          python3 scripts/verify_update_history.py
          python3 scripts/verify_manifest.py
          python3 scripts/verify_update_version_page.py
          python3 .github/scripts/verify_manifest_signature.py
          git diff --check

      - name: Commit entry source ref and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-repair-entry-source-ref.yml
          git add ToolHub.js ToolHub.js.sha256 manifest.json manifest.sig update_history.json \
            updates/records/20260726-beta-system-server-window-remove-crash.json scripts
          git commit -m "指定修复分支入口更新源"
          git push origin HEAD:agent/beta-fix-wm-remove-view-crash-20260726
