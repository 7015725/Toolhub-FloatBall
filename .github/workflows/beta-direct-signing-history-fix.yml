name: beta-direct-signing-history-fix

on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/beta-direct-signing-history-fix.yml

permissions:
  contents: write

environment: signing

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: signing
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN || github.token }}
          persist-credentials: false

      - name: Install signing key
        shell: bash
        env:
          TOOLHUB_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.TOOLHUB_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          if [ -z "$TOOLHUB_SIGNING_PRIVATE_KEY_PEM" ]; then
            echo "TOOLHUB_SIGNING_PRIVATE_KEY_PEM is empty"
            exit 1
          fi
          mkdir -p "$HOME/.hermes/toolhub_signing"
          printf '%s\n' "$TOOLHUB_SIGNING_PRIVATE_KEY_PEM" > "$HOME/.hermes/toolhub_signing/private_key.pem"
          chmod 600 "$HOME/.hermes/toolhub_signing/private_key.pem"

      - name: Patch direct-beta signing and rebuild release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          verify = Path('scripts/verify_manifest.py')
          text = verify.read_text(encoding='utf-8')
          if 'import argparse\n' not in text:
              text = text.replace('import ast\n', 'import argparse\nimport ast\n', 1)
          main_anchor = 'def main():\n    for path in (CODE_DIR, MANIFEST, ENTRY, ENTRY_SHA, HISTORY, SIGN_SCRIPT):\n'
          main_replacement = 'def main():\n    ap = argparse.ArgumentParser()\n    ap.add_argument("--allow-pending", action="store_true")\n    args = ap.parse_args()\n\n    for path in (CODE_DIR, MANIFEST, ENTRY, ENTRY_SHA, HISTORY, SIGN_SCRIPT):\n'
          if main_replacement not in text:
              if main_anchor not in text:
                  raise SystemExit('verify_manifest main anchor missing')
              text = text.replace(main_anchor, main_replacement, 1)
          history_anchor = '''    subprocess.check_call(
              [sys.executable, "scripts/verify_update_history.py"], cwd=str(ROOT)
          )
          '''
          history_replacement = '''    history_args = [sys.executable, "scripts/verify_update_history.py"]
              if args.allow_pending:
                  history_args.append("--require-one-pending")
              subprocess.check_call(history_args, cwd=str(ROOT))
          '''
          if history_replacement not in text:
              if history_anchor not in text:
                  raise SystemExit('verify_manifest history anchor missing')
              text = text.replace(history_anchor, history_replacement, 1)
          verify.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/sign-toolhub.yml')
          flow = workflow.read_text(encoding='utf-8')
          flow = flow.replace(
              'if python3 scripts/verify_manifest.py && python3 .github/scripts/verify_manifest_signature.py; then',
              'if python3 scripts/verify_manifest.py --allow-pending && python3 .github/scripts/verify_manifest_signature.py; then',
              1,
          )
          old_generate = '''      - name: Generate signed manifest
              if: steps.current-generated.outputs.current != 'true'
              shell: bash
              run: python3 scripts/generate_signed_manifest.py --yes --channel "$TOOLHUB_UPDATE_CHANNEL"
          '''
          new_generate = '''      - name: Generate signed manifest
              if: steps.current-generated.outputs.current != 'true'
              shell: bash
              run: |
                if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
                  git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
                  history_base="origin/${{ github.event.pull_request.base.ref }}"
                else
                  history_base="$(git log -1 --format=%H -- manifest.json)"
                  if [ -z "$history_base" ]; then history_base="HEAD^"; fi
                fi
                echo "history_base=$history_base"
                python3 scripts/generate_signed_manifest.py --yes --channel "$TOOLHUB_UPDATE_CHANNEL" --base-ref "$history_base"
          '''
          if new_generate not in flow:
              if old_generate not in flow:
                  raise SystemExit('sign workflow generate anchor missing')
              flow = flow.replace(old_generate, new_generate, 1)
          old_verify = '''      - name: Verify signed release bundle
              shell: bash
              run: |
                python3 scripts/verify_manifest.py
                python3 scripts/verify_update_version_page.py
                python3 .github/scripts/verify_manifest_signature.py
          '''
          new_verify = '''      - name: Verify signed release bundle
              shell: bash
              run: |
                if [ "${{ steps.current-generated.outputs.current }}" = "true" ]; then
                  python3 scripts/verify_manifest.py --allow-pending
                else
                  python3 scripts/verify_manifest.py
                fi
                python3 scripts/verify_update_version_page.py
                python3 .github/scripts/verify_manifest_signature.py
          '''
          if new_verify not in flow:
              if old_verify not in flow:
                  raise SystemExit('sign workflow verify anchor missing')
              flow = flow.replace(old_verify, new_verify, 1)
          workflow.write_text(flow, encoding='utf-8')

          record = Path('updates/records/20260727-beta-entry-channel-module-filter.json')
          clean = {
              'schema': 1,
              'id': '20260727-beta-entry-channel-module-filter',
              'manifestVersion': 0,
              'type': 'fix',
              'title': '修复 Beta 入口跨通道模块清单自检',
              'details': [
                  'Beta 入口仅在当前活动更新通道为 beta 时加载 ShortXUI Runtime 与实验室模块。',
                  '使用 Beta 入口但本地活动通道仍为 stable 时，入口会自动过滤 Beta 专用模块，并与 main Manifest 保持一致。',
                  'Beta 通道仍完整加载 th_24_shortx_ui_runtime.js 和 th_34_shortx_ui_lab.js；main 与 ClipHub 不做修改。'
              ]
          }
          record.write_text(json.dumps(clean, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python3 -m py_compile scripts/verify_manifest.py
          python3 scripts/verify_update_history.py --require-one-pending
          python3 scripts/generate_signed_manifest.py --yes --channel beta --base-ref 9e56992eea3acc4d19ea43872d43279cce5473a3
          python3 scripts/verify_manifest.py
          python3 .github/scripts/verify_manifest_signature.py
          python3 scripts/verify_update_version_page.py
          python3 scripts/verify_shortx_ui_windowhost.py
          python3 .github/scripts/es5_scan.py
          python3 scripts/verify_js_syntax.py
          git diff --check

      - name: Commit corrected signing state
        shell: bash
        env:
          TOOLHUB_AUTOMATION_TOKEN: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}
        run: |
          if [ -z "$TOOLHUB_AUTOMATION_TOKEN" ]; then
            echo "TOOLHUB_AUTOMATION_TOKEN is empty"
            exit 1
          fi
          git rm .github/workflows/beta-direct-signing-history-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/sign-toolhub.yml scripts/verify_manifest.py manifest.json manifest.sig ToolHub.js.sha256 update_history.json updates/records/20260727-beta-entry-channel-module-filter.json
          git commit -m "Beta：修正直推签名基线与入口发布记录"
          git remote set-url origin "https://x-access-token:${TOOLHUB_AUTOMATION_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:beta
