name: build-toolhub-dex-runtime

on:
  push:
    branches: [agent/build-toolhub-dex-runtime]
    paths:
      - ToolHub.js
      - code/**
      - runtime-dex/**
      - scripts/generate_toolhub_standalone.py
      - .github/workflows/build-toolhub-dex-runtime.yml
  pull_request:
    branches: [beta]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-toolhub-dex-runtime
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEX branch
        uses: actions/checkout@v4
        with:
          ref: agent/build-toolhub-dex-runtime
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android D8
        shell: bash
        run: |
          yes | sdkmanager "build-tools;35.0.0" >/dev/null || true
          test -x "$ANDROID_HOME/build-tools/35.0.0/d8"
          test -x "$ANDROID_HOME/build-tools/35.0.0/dexdump"

      - name: Generate verified ToolHub runtime bundle
        shell: bash
        run: |
          python3 scripts/generate_toolhub_standalone.py
          python3 scripts/generate_toolhub_standalone.py --check

      - name: Compile Java bridge
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$GITHUB_WORKSPACE/runtime-dex/build"
          mkdir -p "$BUILD/lib" "$BUILD/classes" "$BUILD/dex" "$BUILD/package/META-INF"
          curl --fail --location --retry 3 \
            --output "$BUILD/lib/rhino.jar" \
            "https://repo1.maven.org/maven2/org/mozilla/rhino/1.7.15.1/rhino-1.7.15.1.jar"
          javac --release 8 \
            -encoding UTF-8 \
            -cp "$BUILD/lib/rhino.jar" \
            -d "$BUILD/classes" \
            $(find runtime-dex/src -name '*.java' -type f | sort)
          jar cf "$BUILD/toolhub-runtime-classes.jar" -C "$BUILD/classes" .

      - name: Convert bridge to classes.dex
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$GITHUB_WORKSPACE/runtime-dex/build"
          "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --release \
            --min-api 26 \
            --classpath "$BUILD/lib/rhino.jar" \
            --output "$BUILD/dex" \
            "$BUILD/toolhub-runtime-classes.jar"
          test -s "$BUILD/dex/classes.dex"
          MAGIC="$(head -c 8 "$BUILD/dex/classes.dex" | od -An -tx1 | tr -d ' \n')"
          case "$MAGIC" in
            6465780a30333500|6465780a30333700|6465780a30333800|6465780a30333900|6465780a30343000) ;;
            *) echo "Unexpected DEX magic: $MAGIC"; exit 1 ;;
          esac

      - name: Assemble DEX JAR
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$GITHUB_WORKSPACE/runtime-dex/build"
          OUT="$GITHUB_WORKSPACE/runtime-dex/dist"
          PACKAGE="$BUILD/package"
          mkdir -p "$OUT"
          cp "$BUILD/dex/classes.dex" "$PACKAGE/classes.dex"
          cp ToolHub-Beta-Standalone.js "$PACKAGE/toolhub-runtime.js"
          cp runtime-dex/resources/toolhub-dex-api.js "$PACKAGE/toolhub-dex-api.js"
          (cd "$PACKAGE" && sha256sum toolhub-runtime.js > toolhub-runtime.js.sha256)
          cat > "$PACKAGE/META-INF/MANIFEST.MF" <<'EOF'
          Manifest-Version: 1.0
          Implementation-Title: ToolHubRuntime
          Implementation-Version: 0.9.2-beta-dex-1
          ToolHub-Api-Version: 1
          ToolHub-Channel: beta
          ToolHub-Entry-Class: com.xin.toolhub.runtime.ToolHubRuntime
          EOF
          (
            cd "$PACKAGE"
            zip -q -0 -r "$OUT/ToolHubRuntime-0.9.2-beta-dex-1.jar" .
          )
          cp runtime-dex/ToolHubRuntimeLoader.js "$OUT/ToolHubRuntimeLoader.js"
          sha256sum "$OUT/ToolHubRuntime-0.9.2-beta-dex-1.jar" > "$OUT/ToolHubRuntime-0.9.2-beta-dex-1.jar.sha256"
          sha256sum "$OUT/ToolHubRuntimeLoader.js" > "$OUT/ToolHubRuntimeLoader.js.sha256"

      - name: Build report
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/runtime-dex/dist"
          JAR="$OUT/ToolHubRuntime-0.9.2-beta-dex-1.jar"
          {
            echo "ToolHubRuntime DEX build"
            echo "version=0.9.2-beta-dex-1"
            echo "apiVersion=1"
            echo "jarBytes=$(stat -c %s "$JAR")"
            echo "jarSha256=$(sha256sum "$JAR" | awk '{print $1}')"
            echo "loaderBytes=$(stat -c %s "$OUT/ToolHubRuntimeLoader.js")"
            echo "loaderSha256=$(sha256sum "$OUT/ToolHubRuntimeLoader.js" | awk '{print $1}')"
            echo "runtimeBundleSha256=$(sha256sum ToolHub-Beta-Standalone.js | awk '{print $1}')"
          } | tee "$OUT/build-report.txt"

      - name: Verify JAR entries
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/runtime-dex/dist"
          JAR="$OUT/ToolHubRuntime-0.9.2-beta-dex-1.jar"
          unzip -Z1 "$JAR" | sed 's#^\./##' | sort > "$OUT/jar-entries.txt"
          for entry in classes.dex toolhub-runtime.js toolhub-runtime.js.sha256 toolhub-dex-api.js META-INF/MANIFEST.MF; do
            grep -Fxq "$entry" "$OUT/jar-entries.txt" || { echo "Missing JAR entry: $entry"; cat "$OUT/jar-entries.txt"; exit 1; }
          done
          unzip -p "$JAR" toolhub-runtime.js > "$OUT/runtime-check.js"
          unzip -p "$JAR" toolhub-runtime.js.sha256 > "$OUT/runtime-check.sha256"
          (cd "$OUT" && sha256sum -c runtime-check.sha256)

      - name: Verify DEX entry class
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/runtime-dex/dist"
          JAR="$OUT/ToolHubRuntime-0.9.2-beta-dex-1.jar"
          unzip -p "$JAR" classes.dex > "$OUT/classes.dex"
          "$ANDROID_HOME/build-tools/35.0.0/dexdump" -f "$OUT/classes.dex" > "$OUT/dexdump.txt"
          grep -Eq "Lcom/xin/toolhub/runtime/ToolHubRuntime;|com\.xin\.toolhub\.runtime\.ToolHubRuntime" "$OUT/dexdump.txt" || {
            echo "ToolHubRuntime class not found in classes.dex"
            strings "$OUT/classes.dex" | grep -i toolhub || true
            exit 1
          }

      - name: Verify Loader and Rhino ES5
        shell: bash
        run: |
          set -euo pipefail
          grep -q "DexClassLoader" runtime-dex/ToolHubRuntimeLoader.js
          grep -q "com.xin.toolhub.runtime.ToolHubRuntime" runtime-dex/ToolHubRuntimeLoader.js
          grep -q "function invoke" runtime-dex/resources/toolhub-dex-api.js
          node --check runtime-dex/ToolHubRuntimeLoader.js
          node --check runtime-dex/resources/toolhub-dex-api.js
          python3 .github/scripts/es5_scan.py

      - name: Upload DEX runtime artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToolHubRuntime-0.9.2-beta-dex-1
          path: runtime-dex/dist/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
