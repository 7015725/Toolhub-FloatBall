name: trigger-pickword-beta-fix-20260820

on:
  pull_request:
    branches: [beta]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  repair-signing-helper:
    if: github.event.pull_request.head.ref == 'agent/pickword-beta-fix-trigger-20260820'
    runs-on: ubuntu-latest
    env:
      TOOLHUB_AUTOMATION_TOKEN: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN || github.token }}
          persist-credentials: false

      - name: Allow current pickword version in reference-layout helper
        shell: bash
        run: |
          set -eo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_pickword_reference_layout.py')
          text = path.read_text(encoding='utf-8')
          version_anchor = 'NEW_VERSION = "// @version 1.0.22\\n"\n'
          if 'CURRENT_VERSION = "// @version 1.0.23\\n"' not in text:
              if text.count(version_anchor) != 1:
                  raise SystemExit('reference-layout version anchor drift')
              text = text.replace(version_anchor, version_anchor + 'CURRENT_VERSION = "// @version 1.0.23\\n"\n', 1)
          old_markers = '''    markers = (\n        NEW_VERSION.strip(),\n        "function createPickwordImageActionGrid20(thumbRoot)",\n'''
          new_markers = '''    markers = (\n        "function createPickwordImageActionGrid20(thumbRoot)",\n'''
          if old_markers in text:
              text = text.replace(old_markers, new_markers, 1)
          old_return = '    return all(marker in text for marker in markers)\n'
          new_return = '    return (text.startswith(NEW_VERSION) or text.startswith(CURRENT_VERSION)) and all(marker in text for marker in markers)\n'
          if new_return not in text:
              if text.count(old_return) != 1:
                  raise SystemExit('reference-layout already_applied return drift')
              text = text.replace(old_return, new_return, 1)
          text = text.replace('print("OK pickword reference layout already applied version=1.0.22")', 'print("OK pickword reference layout already applied version=current")')
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/apply_pickword_reference_layout.py
          grep -q '^// @version 1.0.23$' code/th_20_pickword.js
          git diff --check
          git diff --exit-code -- code/th_20_pickword.js

      - name: Commit and push helper repair
        shell: bash
        run: |
          set -eo pipefail
          test -n "$TOOLHUB_AUTOMATION_TOKEN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/apply_pickword_reference_layout.py
          if git diff --cached --quiet; then
            echo 'Signing helper already compatible'
            exit 0
          fi
          git commit -m '修复拾字 1.0.23 签名辅助脚本兼容性'
          git remote set-url origin "https://x-access-token:${TOOLHUB_AUTOMATION_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:beta
