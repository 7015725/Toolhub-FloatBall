name: finalize-beta-wm-remove-fix

on:
  pull_request:
    branches:
      - beta
    types: [synchronize]

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/beta-fix-wm-remove-view-crash-20260726

jobs:
  finalize:
    if: github.head_ref == 'agent/beta-fix-wm-remove-view-crash-20260726'
    runs-on: ubuntu-latest
    environment: signing
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta-fix-wm-remove-view-crash-20260726
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Refresh module symbol audit
        shell: bash
        run: python3 scripts/report_module_symbol_audits.py --write docs/audits/MODULE_SYMBOL_AUDIT.md

      - name: Reset current record for Beta-relative finalization
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('updates/records/20260726-beta-system-server-window-remove-crash.json')
          record = json.loads(path.read_text(encoding='utf-8'))
          record['manifestVersion'] = 0
          for key in ('date', 'modules', 'entry'):
              record.pop(key, None)
          path.write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Install signing key
        shell: bash
        env:
          TOOLHUB_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.TOOLHUB_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          test -n "$TOOLHUB_SIGNING_PRIVATE_KEY_PEM"
          mkdir -p "$HOME/.hermes/toolhub_signing"
          printf '%s\n' "$TOOLHUB_SIGNING_PRIVATE_KEY_PEM" > "$HOME/.hermes/toolhub_signing/private_key.pem"
          chmod 600 "$HOME/.hermes/toolhub_signing/private_key.pem"

      - name: Generate Beta-relative signed artifacts
        shell: bash
        run: |
          git fetch --no-tags origin beta
          python3 scripts/verify_update_history.py --require-one-pending
          python3 scripts/generate_signed_manifest.py \
            --yes \
            --channel beta \
            --base-ref origin/beta

      - name: Verify final repair bundle
        shell: bash
        run: |
          python3 .github/scripts/es5_scan.py
          python3 scripts/verify_js_syntax.py
          python3 scripts/verify_code_constraints.py --output code-constraint-report.json
          python3 scripts/report_module_symbol_audits.py --check docs/audits/MODULE_SYMBOL_AUDIT.md
          python3 scripts/verify_main_panel_close_lifecycle.py
          python3 scripts/verify_toolapp_main_thread_affinity.py
          python3 scripts/verify_changed_module_versions.py --base-ref origin/beta
          python3 scripts/verify_update_history.py
          python3 scripts/verify_manifest.py
          python3 scripts/verify_update_version_page.py
          python3 .github/scripts/verify_manifest_signature.py
          git diff --check

      - name: Commit final artifacts and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-beta-wm-remove-fix.yml
          git add docs/audits/MODULE_SYMBOL_AUDIT.md \
            manifest.json manifest.sig ToolHub.js.sha256 update_history.json \
            updates/records/20260726-beta-system-server-window-remove-crash.json
          git commit -m "整理 Beta 修复审计与签名基线"
          git push origin HEAD:$TARGET_BRANCH
