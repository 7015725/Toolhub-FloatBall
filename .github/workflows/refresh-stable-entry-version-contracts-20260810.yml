name: refresh-stable-entry-version-contracts-20260810

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: refresh-stable-entry-version-contracts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'release/main-20260810-sync-final'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN || github.token }}
          persist-credentials: false

      - name: Refresh stale entry-version verifier contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = 'var TOOLHUB_ENTRY_VERSION = 20260721201500;'
          new = 'var TOOLHUB_ENTRY_VERSION = 20260810005000;'
          changed = []
          for path in sorted(Path('scripts').glob('verify_*.py')):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  continue
              count = text.count(old)
              text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
              changed.append((str(path), count))
          print('ENTRY_VERSION_CONTRACT_FILES=' + ','.join(path for path, _ in changed))
          print('ENTRY_VERSION_CONTRACT_REPLACEMENTS=' + str(sum(count for _, count in changed)))
          if not changed:
              print('No stale entry-version verifier contracts remain')
          PY
          git diff -- scripts/verify_*.py
          git diff --check

      - name: Commit verifier contract refresh
        shell: bash
        env:
          TOOLHUB_AUTOMATION_TOKEN: ${{ secrets.TOOLHUB_AUTOMATION_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify_*.py
          if git diff --cached --quiet; then
            echo "Verifier entry-version contracts already current"
            exit 0
          fi
          git commit -m "更新 2026-08-10 Stable 入口版本验证契约"
          if [ -n "$TOOLHUB_AUTOMATION_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${TOOLHUB_AUTOMATION_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
